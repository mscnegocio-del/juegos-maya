<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#fff7ec">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Michi</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maya">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { touch-action: none; background: #fde8e0; --suelo: max(190px, 22dvh); }
    [hidden] { display: none !important; }

    /* ---------- Escenario: fondo ilustrado (cover) + objetos + Michi ---------- */
    #escenario { position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh; transform-origin: 50% 60%;
                 transition: transform .9s cubic-bezier(.45, .05, .25, 1), filter .9s; background-size: cover; background-position: center 70%; }
    .cuarto-sala #escenario { background-image: url(../../assets/img/casa/fondo-sala.webp); background-color: #f4c7a8; }
    .cuarto-bano #escenario { background-image: url(../../assets/img/casa/fondo-bano.webp); background-color: #a9d8f0; }
    .cuarto-cocina #escenario { background: linear-gradient(#fff1d6 0 58%, #e9c79a 58%); }
    .cuarto-dormitorio #escenario { background: linear-gradient(#ece0fb 0 58%, #c4adec 58%); }
    body.enfocado #escenario { transform: scale(1.25); filter: blur(5px) brightness(.85); }
    #fondo { position: absolute; inset: 0; filter: blur(2.2px); pointer-events: none; }
    .deco, .obj { position: absolute; }
    .deco svg, .obj svg { width: 100%; height: auto; display: block; overflow: visible; }
    .obj { z-index: 3; background: none; padding: 0; }
    .zona-toque { position: absolute; z-index: 4; background: none; border-radius: 30px; }
    .zona-toque.brilla, .obj.brilla { animation: brillo .7s ease-in-out infinite alternate; }
    .zona-toque.brilla { background: radial-gradient(closest-side, rgba(255, 255, 255, .55), rgba(255, 230, 120, .25) 70%, transparent); }
    @keyframes brillo { to { filter: drop-shadow(0 0 12px #fff) drop-shadow(0 0 4px #ffd23f) brightness(1.12); } }

    /* ---------- Capa de escena (primer plano): mueble grande + Michi; el cuarto queda desenfocado detrás ---------- */
    #capa { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; transition: opacity .6s; }
    body.enfocado #capa { opacity: 1; pointer-events: auto; }
    .mueble { position: absolute; pointer-events: none; }
    .mueble img { width: 100%; height: 100%; display: block; }
    .mueble.adelante { z-index: 7; } .mueble.atras { z-index: 3; }
    .mueble.borde { -webkit-mask: linear-gradient(transparent 29%, #000 29%), radial-gradient(ellipse 41% 5.5% at 50% 29%, transparent 97%, #000 100%);
                    -webkit-mask-composite: source-in; mask: linear-gradient(transparent 29%, #000 29%), radial-gradient(ellipse 41% 5.5% at 50% 29%, transparent 97%, #000 100%);
                    mask-composite: intersect; }
    button.mueble.tocable { background: none; border: 0; padding: 0; }
    button.mueble.tocable svg { width: 100%; height: auto; display: block; }
    .mueble .tocable { position: absolute; pointer-events: auto; background: none; border-radius: 50%; }
    .mueble .tocable.brilla { animation: brillo .7s ease-in-out infinite alternate; background: radial-gradient(closest-side, rgba(255,255,255,.7), rgba(255,230,120,.3) 70%, transparent); }
    #primer-plano { position: absolute; left: 50%; transform: translateX(-50%); z-index: 6; }
    #primer-plano img { width: 100%; height: 100%; display: block; }
    #primer-plano svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

    /* ---------- Michi (imágenes) ---------- */
    #michi { position: absolute; z-index: 5; transform: translateX(-50%); aspect-ratio: 661 / 760;
             transition: left .8s ease-in-out, bottom .8s ease-in-out, height .8s ease-in-out, transform .8s ease-in-out; }
    #michi.familia-banera { aspect-ratio: 644 / 700; }
    .michi-anim { position: absolute; inset: 0; transform-origin: 50% 100%; animation: respirar 3s ease-in-out infinite; }
    .michi-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%;
                 filter: drop-shadow(0 12px 10px rgba(60, 30, 30, .22)); user-select: none; -webkit-user-drag: none; pointer-events: none; }
    .michi-capa { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .michi-capa [data-zona] { pointer-events: all; fill: transparent; cursor: pointer; }
    .mancha { display: none; transition: opacity .4s; pointer-events: none; }
    .mancha.visible { display: inline; }
    .mancha.limpia { opacity: 0; }
    @keyframes respirar { 50% { transform: scale(1.012, .988); } }
    #michi.ronronea .michi-anim { animation: ladear 1.2s ease-in-out infinite alternate; }
    @keyframes ladear { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    #michi:is(.cosquillas, .sacudir) .michi-anim { animation: cosquillas .16s linear infinite; }
    @keyframes cosquillas { 25% { transform: rotate(-3deg) translateX(-1%); } 75% { transform: rotate(3deg) translateX(1%); } }
    #michi.estornudo .michi-anim { animation: estornudo 1s ease-in-out; }
    @keyframes estornudo { 50% { transform: rotate(-4deg) translateY(-3%); } 65% { transform: rotate(3deg) translateY(2%) scale(1.03, .97); } }
    #michi.salta .michi-anim { animation: saltar .7s cubic-bezier(.3, 1.4, .5, 1); }
    @keyframes saltar { 40% { transform: translateY(-24%) scale(1.03, .97); } }
    #michi.caminando .michi-anim { animation: caminar .32s ease-in-out infinite alternate; }
    @keyframes caminar { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-5%) rotate(3deg); } }
    #michi.baila .michi-anim { animation: bailar .45s ease-in-out infinite alternate; }
    @keyframes bailar { from { transform: rotate(-9deg) translateY(0); } to { transform: rotate(9deg) translateY(-10%); } }
    #michi.mareado .michi-anim { animation: marear .8s linear infinite; }
    @keyframes marear { 0%, 100% { transform: rotate(-6deg) translateX(-3%); } 50% { transform: rotate(6deg) translateX(3%); } }
    #michi.temblor .michi-anim { animation: temblor .12s linear infinite; }
    @keyframes temblor { 50% { transform: translateX(1%) scale(1.01, .99); } }
    #michi.apurado .michi-anim { animation: apurado .3s ease-in-out 6 alternate; }
    @keyframes apurado { to { transform: translateY(-4%) rotate(3deg); } }
    #michi:is(.bosteza, .estirarse) .michi-anim { animation: estirar 1.4s ease-in-out; }
    @keyframes estirar { 40% { transform: scale(.95, 1.1); } }
    #michi:is(.zarpazo, .saluda, .pancita, .rascarse) .michi-anim { animation: inclinar .45s ease-in-out 2 alternate; }
    @keyframes inclinar { to { transform: rotate(6deg) translateX(2%); } }
    #michi.frotando .michi-anim { animation: frotar .25s ease-in-out infinite alternate; }
    @keyframes frotar { to { transform: rotate(-2deg) translateY(1%); } }
    #michi.mojado .michi-img { filter: saturate(.85) brightness(.95) drop-shadow(0 12px 10px rgba(60, 30, 30, .22)); }
    #michi.brillante .michi-img { filter: brightness(1.08) drop-shadow(0 0 14px #fff); }
    #michi.duerme { transform: translateX(-50%); }
    #michi.duerme .michi-anim { animation-duration: 5s; }

    /* ---------- Efectos ---------- */
    .efecto { position: fixed; pointer-events: none; z-index: 20; }
    .corazon { width: 34px; height: 34px; animation: flotar 1.4s ease-out forwards; }
    .destello { width: 30px; height: 30px; animation: destellar .9s ease-out forwards; }
    @keyframes destellar { 0% { transform: scale(0) rotate(0); } 50% { transform: scale(1.2) rotate(45deg); } 100% { transform: scale(0) rotate(90deg); opacity: 0; } }
    @keyframes flotar { to { transform: translate(var(--dx, 0), -140px) scale(1.4); opacity: 0; } }
    .zeta { font: 800 40px var(--font); color: #fff; text-shadow: 0 3px 0 var(--ink); animation: flotar 2.4s ease-out forwards; }
    .burbuja { position: absolute; border-radius: 50%; pointer-events: none; z-index: 6; animation: aparecer .25s ease-out;
               border: 1.5px solid rgba(110, 170, 210, .8); transform: translate(-50%, -50%); }
    @keyframes aparecer { from { transform: translate(-50%, -50%) scale(0); } }
    .burbuja.revienta { animation: reventar .4s ease-out forwards; }
    @keyframes reventar { to { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }
    .gota { width: 10px; height: 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: #5bb8f0; animation: caer-gota .9s linear forwards; }
    @keyframes caer-gota { to { transform: translateY(var(--caida, 260px)); opacity: .2; } }
    .salpicon { width: 12px; height: 12px; border-radius: 50%; background: #7fd3ff; animation: salpicar .7s ease-out forwards; }
    @keyframes salpicar { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
    .nube-pum { width: 130px; height: 110px; animation: pum 1.8s ease-out forwards; }
    @keyframes pum { 0% { transform: scale(.2); opacity: 0; } 20% { opacity: .95; } 100% { transform: translate(-60px, -50px) scale(1.6); opacity: 0; } }
    .remolino { position: absolute; z-index: 8; pointer-events: none; animation: girar .6s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }
    .chorro { position: absolute; z-index: 8; border-radius: 6px; pointer-events: none;
              background: linear-gradient(90deg, #7fd3ff, #c8eeff, #7fd3ff); animation: chorro .3s linear infinite; opacity: .9; }
    @keyframes chorro { 50% { opacity: .6; } }
    .papel-tira { position: absolute; z-index: 8; background: #fff; border: 2px solid #e5ded4; border-top: none; border-radius: 0 0 6px 6px;
                  transform-origin: 50% 0; animation: desenrollar .8s ease-out forwards; }
    @keyframes desenrollar { from { transform: scaleY(0); } }
    .estrellas-mareo { position: absolute; left: 20%; right: 20%; top: -4%; height: 18%; z-index: 6; pointer-events: none; animation: girar 1.2s linear infinite; }
    .noche { position: fixed; inset: 0; background: rgba(20, 16, 60, .62); pointer-events: none; opacity: 0; transition: opacity .8s; z-index: 4; }
    body.oscuro .noche { opacity: 1; }
    .bichito { transform-box: fill-box; transform-origin: center; animation: bichito .6s ease-in-out infinite alternate; }
    @keyframes bichito { to { transform: translateY(-4px) rotate(10deg); } }
    .bichito.fuera { animation: bichito-fuera .4s ease-in forwards; }
    @keyframes bichito-fuera { to { transform: translateY(-50px) scale(0); opacity: 0; } }
    #ovillo { z-index: 6; touch-action: none; }
    #lampara { z-index: 6 !important; } /* que Michi dormido nunca tape la lámpara */

    /* ---------- Interfaz ---------- */
    .barra { position: fixed; left: 0; right: 0; bottom: 0; height: 96px; z-index: 30; display: flex; justify-content: center; align-items: center; gap: min(4vw, 26px);
             background: linear-gradient(transparent, rgba(255, 255, 255, .55)); padding-bottom: 6px; }
    .boton-cuarto { width: 70px; height: 70px; border-radius: 50%; position: relative; display: grid; place-items: center;
                    background: conic-gradient(var(--color) calc(var(--nivel, 100) * 1%), #ffffffb0 0); box-shadow: 0 5px 0 rgba(0, 0, 0, .15);
                    transition: transform .15s; }
    .boton-cuarto::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #fff; }
    .boton-cuarto.activo::before { background: #fff3c4; }
    .boton-cuarto svg { position: relative; width: 40px; height: 40px; }
    .boton-cuarto.baja { animation: wiggle .6s ease-in-out infinite; }
    .boton-cuarto:active { transform: scale(.9); }
    .carino { position: fixed; top: 16px; right: 16px; width: 64px; height: 64px; z-index: 30; display: grid; place-items: center;
              background: #fff; border-radius: 50%; box-shadow: 0 5px 0 rgba(0, 0, 0, .12); }
    .carino svg { width: 40px; height: 40px; transition: transform .3s; }
    .carino .nivel { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(#ff5a87 calc(var(--nivel, 50) * 1%), transparent 0);
                     -webkit-mask: radial-gradient(circle, transparent 25px, #000 26px); mask: radial-gradient(circle, transparent 25px, #000 26px); }
    #volver { position: fixed; top: 16px; left: 100px; width: 72px; height: 72px; border-radius: 50%; background: #fff; z-index: 30;
              box-shadow: 0 6px 0 rgba(0, 0, 0, .12); display: grid; place-items: center; }
    #volver svg { width: 38px; height: 38px; }
    .bandeja { position: fixed; left: 50%; bottom: 102px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 31;
               background: #fff; padding: 7px 12px; border-radius: 40px; box-shadow: 0 6px 0 rgba(0, 0, 0, .12); max-width: calc(100vw - 20px); }
    .item { width: min(62px, calc((100vw - 84px) / 6)); aspect-ratio: 1 / 1; border-radius: 50%; display: grid; place-items: center;
            background: #fff7ec; flex: none; touch-action: none; transition: transform .12s; }
    .item svg { width: 76%; height: 76%; pointer-events: none; }
    .item:active, .item.activo { transform: scale(1.12); background: var(--amarillo); }
    .item.brilla { animation: brillo .7s ease-in-out infinite alternate; }
    .arrastrando, .herramienta-mano { position: fixed; width: 76px; height: 76px; z-index: 40; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); }
    .arrastrando svg, .herramienta-mano svg { width: 100%; height: 100%; }
    .volando { position: fixed; width: 64px; height: 64px; z-index: 40; pointer-events: none; }
    .volando svg { width: 100%; height: 100%; }
    .pensamiento { position: fixed; z-index: 29; width: 84px; height: 72px; background: #fff; border-radius: 40px;
                   box-shadow: 0 5px 0 rgba(0, 0, 0, .12); display: grid; place-items: center; animation: aparecer-p .3s ease-out; }
    @keyframes aparecer-p { from { transform: scale(0); } }
    .pensamiento svg { width: 46px; height: 46px; }

    @media (prefers-reduced-motion: reduce) {
      #escenario, #capa { transition-duration: .01s; }
      .michi-anim, #michi *, .estrellas-mareo, .boton-cuarto.baja, .obj.brilla, .zona-toque.brilla, .item.brilla, .bichito, .remolino { animation: none !important; }
      .corazon, .zeta, .gota, .destello, .nube-pum, .salpicon, .papel-tira { animation-duration: .01s; }
    }
  </style>
</head>
<body class="cuarto-sala">
  <a class="btn-casa" href="../../" aria-label="Volver al menú">🏠</a>
  <button id="volver" aria-label="Volver al cuarto" hidden></button>
  <div class="carino" id="carino" aria-label="Cariño"><span class="nivel"></span></div>
  <main id="escenario">
    <div id="fondo"></div>
    <div id="objetos"></div>
    <div id="michi"></div>
  </main>
  <div id="capa"></div>
  <div class="noche"></div>
  <div class="bandeja" id="bandeja" hidden></div>
  <nav class="barra" id="barra"></nav>

  <script src="../../assets/vendor/gsap/gsap.min.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/dibujos.js"></script>
  <script src="../../assets/js/michi.js"></script>
  <script src="../../assets/js/michi-casa.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const escenario = $("escenario"), fondo = $("fondo"), objetos = $("objetos"), michi = $("michi"), bandeja = $("bandeja"), capa = $("capa");
    const esperar = ms => new Promise(r => setTimeout(r, ms));
    const IMG = "../../assets/img/";

    // ================= Michi: imágenes por emoción + capa invisible con zonas tocables y manchas =================
    // Todas las poses de cuerpo entero comparten el mismo marco (661x760), así Michi no "salta" al cambiar de cara.
    // Coordenadas de la capa = píxeles de esa imagen.
    const FAMILIAS = {
      cuerpo: { vb: "0 0 661 760",
        zonas: `<ellipse data-zona="cabeza" cx="300" cy="200" rx="215" ry="185"/>
          <ellipse data-zona="mejilla" cx="180" cy="315" rx="48" ry="40"/><ellipse data-zona="mejilla" cx="430" cy="330" rx="48" ry="40"/>
          <ellipse data-zona="nariz" cx="300" cy="305" rx="26" ry="22"/>
          <ellipse data-zona="cola" cx="545" cy="545" rx="75" ry="115"/>
          <ellipse data-zona="panza" cx="300" cy="560" rx="130" ry="120"/>
          <ellipse data-zona="pata" cx="120" cy="685" rx="65" ry="60"/><ellipse data-zona="pata" cx="455" cy="685" rx="65" ry="60"/>
          <ellipse data-zona="pata" cx="290" cy="715" rx="110" ry="40"/>`,
        manchas: { frente: [370, 150, 26], panza: [330, 600, 30], "pata-i": [200, 610, 22], cachete: [165, 345, 20], "pata-d": [395, 615, 22], oreja: [150, 120, 18] } },
      banera: { vb: "0 0 644 700", zonas: "",
        manchas: { frente: [400, 170, 26], panza: [320, 500, 28], "pata-i": [150, 470, 22], cachete: [215, 340, 20], "pata-d": [495, 490, 22], oreja: [480, 230, 18] } },
    };
    const SPRITES = ["base", "satisfecho", "riendo", "sorprendido", "esfuerzo", "feliz", "mojado", "lavarse", "saltando", "banera-gato"];
    SPRITES.forEach(n => { const i = new Image(); i.src = `${IMG}michi/${n}.webp`; }); // precarga: el cambio de cara es instantáneo
    michi.innerHTML = `<div class="michi-anim"><img class="michi-img" alt="" src="${IMG}michi/base.webp"><svg class="michi-capa"></svg></div>`;
    const imgMichi = michi.querySelector(".michi-img"), svgMichi = michi.querySelector(".michi-capa");
    let familia = null;
    function ponerFamilia(f) {
      if (f === familia) return;
      // el barro viaja con Michi al cambiar de imagen (p. ej. al meterse a la bañera)
      const sucias = [...svgMichi.querySelectorAll(".mancha.visible:not(.limpia)")].map(m => m.dataset.mancha);
      familia = f;
      const F = FAMILIAS[f];
      michi.classList.toggle("familia-banera", f === "banera");
      svgMichi.setAttribute("viewBox", F.vb);
      svgMichi.innerHTML = F.zonas + Object.entries(F.manchas).map(([id, [x, y, r]]) =>
        `<g class="mancha" data-mancha="${id}" data-x="${x}" data-y="${y}">
          <ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .78}" fill="#8a5a3c" opacity=".8"/>
          <circle cx="${x + r * .9}" cy="${y - r * .5}" r="${r * .35}" fill="#8a5a3c" opacity=".8"/>
          <circle cx="${x - r * .8}" cy="${y + r * .6}" r="${r * .28}" fill="#8a5a3c" opacity=".8"/></g>`).join("");
      sucias.forEach(id => svgMichi.querySelector(`[data-mancha="${id}"]`)?.classList.add("visible"));
    }
    // Elige la imagen según el estado (clases en #michi)
    function elegirSprite() {
      const c = michi.classList, tiene = (...l) => l.some(x => c.contains(x));
      let s = "base";
      if (familia === "banera") s = "banera-gato";
      else if (tiene("manos")) s = "lavarse";
      else if (tiene("mojado")) s = "mojado";
      else if (tiene("salta", "baila")) s = "saltando";
      else if (tiene("esfuerzo")) s = "esfuerzo";
      else if (tiene("sorpresa", "boca-o")) s = "sorprendido";
      else if (tiene("cosquillas") || (tiene("felices") && tiene("abierta"))) s = "riendo";
      else if (tiene("satisfecho", "cerrados", "ronronea", "duerme", "parpadeo")) s = "satisfecho";
      else if (tiene("felices", "corazon", "sonrojado", "masticar", "lengua")) s = "feliz";
      const url = `${IMG}michi/${s}.webp`;
      if (!imgMichi.src.endsWith(url.slice(5))) imgMichi.src = url;
    }
    new MutationObserver(elegirSprite).observe(michi, { attributes: true, attributeFilter: ["class"] });
    // Parpadeo: un instante con los ojos cerrados cada pocos segundos (solo en reposo)
    setInterval(() => {
      if (michi.className.replace(/familia-\w+|caminando/g, "").trim() === "" && familia === "cuerpo") {
        michi.classList.add("parpadeo"); setTimeout(() => michi.classList.remove("parpadeo"), 140);
      }
    }, 3800);

    // ================= Sonidos =================
    // Grabaciones reales (CC0 / dominio público) cuando existen; el resto se sintetiza para que siempre suene algo.
    // Pendientes de grabación real: risa, bostezo, mordisco, agua, descarga, aplausos, pum, plop (ver CREDITOS.md)
    const ARCHIVOS = {
      maullido: "../../assets/sonidos/animales/gato.mp3",
      ronroneo: "../../assets/sonidos/michi/ronroneo.mp3",
      estornudo: "../../assets/sonidos/michi/estornudo.mp3",
    };
    let ctxAudio;
    const audio = () => (ctxAudio ??= new (window.AudioContext || window.webkitAudioContext)());
    function ruido(dur, { filtro = "lowpass", f1 = 1000, f2 = f1, vol = .3, am = 0 } = {}) {
      const a = audio(), n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (am ? (0.5 + 0.5 * Math.sin(i / a.sampleRate * am * 2 * Math.PI)) : 1);
      const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      s.buffer = buf; f.type = filtro;
      f.frequency.setValueAtTime(f1, a.currentTime); f.frequency.exponentialRampToValueAtTime(f2, a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      s.connect(f).connect(g).connect(a.destination); s.start();
    }
    function barrido(f1, f2, dur, tipo = "sine", vol = .2) {
      const a = audio(), o = a.createOscillator(), g = a.createGain();
      o.type = tipo; o.frequency.setValueAtTime(f1, a.currentTime); o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + dur);
      g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + dur);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
    }
    const SINTETICOS = {

    // ================= Necesidades =================

    const NECESIDADES = { hambre: 5, limpieza: 4, bano: 5, sueno: 3, dientes: 2.5, carino: 2 };

    function corazones(n = 5) {

    // Burbuja de espuma pegada a Michi (en % de su imagen, así lo sigue a donde vaya)

    // ================= Posición de Michi =================

    // Fondo ilustrado en "cover": convierte un punto de la imagen de fondo a la pantalla

    // ================= Reacciones al tocar (sin micrófono) =================
    async function reaccion(tipo) {
      if (ocupado) return;

      quitarPensamiento();
      subir("carino", 4);
      switch (tipo) {
        case "cabeza":
          estado("satisfecho ronronea sonrojado", 2200); sonido("ronroneo"); Juegos.decir("Rrrr… ¡me gusta!"); corazones(3); await esperar(2200); break;
        case "panza":

        case "nariz":

    const toques = [];
    let caricia = null;

    });

    // ================= Cuartos =================

    // Zona tocable invisible sobre un objeto del fondo ilustrado (coordenadas de la imagen de fondo)
    function zonaToque(id, etiqueta, [x1, y1, x2, y2], alTocar) {

    // ---------- Sala (fondo ilustrado) ----------

    // Ovillo: Maya lo lanza con el dedo, rueda con rebote y Michi lo mira y a veces le da un zarpazo
    function montarOvillo() {
      const [, oy, s] = enFondo(0, 1010);
      const o = svgObj(Casa.ovillo, `left:68vw;top:${oy - 40}px;width:min(13vw,9dvh)`, { id: "ovillo", etiqueta: "ovillo" });

    // ---------- Cocina (la mesa con platos llega en la parte 2) ----------
    function montarCocina() {
      deco(Casa.heladera, "left:2vw;bottom:calc(var(--suelo) + 6dvh);width:min(26vw,20dvh)");
      deco(Casa.ventanaCiudad, "right:8vw;top:8dvh;width:min(28vw,22dvh)");

          const encima = x > r.left && x < r.right && y > r.top && y < r.bottom;

        });
        bandeja.appendChild(b);
      });
    }
    function centroDe(el) { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
    function arrastrable(el, dibujo, alSoltar) {
      el.addEventListener("pointerdown", e => {
        e.preventDefault(); ultimoToque = Date.now();
        const fantasma = document.createElement("div");
        fantasma.className = "arrastrando"; fantasma.innerHTML = dibujo;
        fantasma.style.left = e.clientX + "px"; fantasma.style.top = e.clientY + "px";
        document.body.appendChild(fantasma);
        const x0 = e.clientX, y0 = e.clientY;
        const mover = ev => { fantasma.style.left = ev.clientX + "px"; fantasma.style.top = ev.clientY + "px"; mirar(ev.clientX, ev.clientY); };
        const soltar = ev => {

    async function comer(comida, [x, y]) {
      if (ocupado || durmiendo) return;

    // ----- Bañera: Michi adentro, manchas de barro, esponja o jabón por todo el cuerpo, ducha, toalla -----
    let manchasQuitadas = 0, reaccionFrote = 0;
    async function escenaBanera() {

      armarEscena = () => {

        await ponerMichi({ cx: A.w / 2, abajo: innerHeight - A.base, h: A.h * .75 });
        estado("mojado sacudir", 1600);
        for (let i = 0; i < 18; i++) { const [x, y] = puntoMichi(100 + Math.random() * 450, 80 + Math.random() * 400); efecto("salpicon", x, y, "", 700, `--dx:${(Math.random() - .5) * 240}px;--dy:${(Math.random() - .7) * 170}px`); }
        await esperar(1700);
        const quedan = svgMichi.querySelectorAll(".mancha.visible:not(.limpia)").length;
        subir("limpieza", quedan ? 20 + manchasQuitadas * 10 : 100);
        estado("feliz brillante", 1800); destellos(9); Juegos.decir(quedan ? "¡Más limpito!" : "¡Qué limpito y brillante estoy!"); corazones(4); subir("carino", 5);
        await esperar(1800);
        await terminarModo();
      }
    }

    // ----- Dientes: primer plano de la boca, bichitos de azúcar, 2 cepillos -----
    const POS_BICHITOS = [[315, 458], [368, 452], [420, 458], [300, 590], [352, 598], [405, 590]];
    const COLORES_BICHITO = ["#a66bff", "#ff7eb6", "#4cd17a", "#ff9f43", "#3fa7ff", "#ffd23f"];
    let svgBoca;
    async function escenaDientes() {
      abrirEscena("z-vaso");
      michi.hidden = true; // en esta escena se ve el primer plano de la cara
      const pp = document.createElement("div");
      pp.id = "primer-plano";
      const n = Math.max(2, Math.min(6, Math.ceil((100 - nivel.dientes) / 15))); // más días sin cepillarse = más bichitos
      pp.innerHTML = `<img src="${IMG}michi/boca.webp" alt=""><svg viewBox="0 0 760 760" stroke="#4a2f2a" stroke-width="3">
        ${POS_BICHITOS.slice(0, n).map(([x, y], i) => `<g class="bichito" data-x="${x}" data-y="${y}" data-frote="0">
          <circle cx="${x}" cy="${y}" r="24" fill="${COLORES_BICHITO[i]}"/>
          <circle cx="${x - 8}" cy="${y - 4}" r="4.5" fill="#2a1a17" stroke="none"/><circle cx="${x + 8}" cy="${y - 4}" r="4.5" fill="#2a1a17" stroke="none"/>
          <path d="M${x - 5} ${y + 6} Q${x} ${y + 10} ${x + 5} ${y + 6}" fill="none" stroke-width="2"/></g>`).join("")}</svg>`;
      capa.appendChild(pp);
      svgBoca = pp.querySelector("svg");
      armarEscena = () => {
        const A = area(), t = Math.min(A.w * .98, A.h * .98);
        Object.assign(pp.style, { width: t + "px", height: t + "px", top: A.arriba + (A.h - t) / 2 + "px" });
      };
      armarEscena();
      herramientas([["cepilloAzul", "cepilloAzul", "cepillo azul"], ["cepilloRosa", "cepilloRosa", "cepillo rosado"]], h => {
        marcarHerramienta(h); brillarHerramienta("cepilloAzul", false); brillarHerramienta("cepilloRosa", false);
        Juegos.decir("¡A cepillar! Saca los bichitos de azúcar");
        frotar = { icono: h, alFrotar: cepillar };
      });
      sonido("bostezo");
      Juegos.decir(`¡Aaah! Michi tiene ${n} bichitos de azúcar. Elige un cepillo`);
      ocupado = false;
      brillarHerramienta("cepilloAzul"); brillarHerramienta("cepilloRosa");
    }
    function cepillar(cx, cy) {
      const p = new DOMPoint(cx, cy).matrixTransform(svgBoca.getScreenCTM().inverse()), x = p.x, y = p.y;
      if (y < 400 || y > 640 || x < 250 || x > 480) return;
      const b = document.createElement("div"); b.className = "burbuja";
      b.style.cssText = `left:${x / 7.6}%;top:${y / 7.6}%;width:${3 + Math.random() * 3}%;aspect-ratio:1;background:radial-gradient(circle at 35% 35%, #fff, #e8f6ff 70%)`;
      $("primer-plano").appendChild(b);
      if (Math.random() < .4) sonido("frote");
      svgBoca.querySelectorAll(".bichito:not(.fuera)").forEach(g => {
        if (Math.hypot(x - +g.dataset.x, y - +g.dataset.y) < 60) {
          g.dataset.frote = +g.dataset.frote + 1;
          if (+g.dataset.frote >= 3) {
            g.classList.add("fuera"); sonido("chirrido");
            setTimeout(() => g.remove(), 400);
            if (!svgBoca.querySelector(".bichito:not(.fuera)")) dientesLimpios();
          }
        }
      });
    }
    async function dientesLimpios() {
      ocupado = true; frotar = null;
      await esperar(500);
      $("primer-plano").querySelectorAll(".burbuja").forEach(b => { b.classList.add("revienta"); setTimeout(() => b.remove(), 400); });
      const r = svgBoca.getBoundingClientRect();
      for (let i = 0; i < 7; i++) setTimeout(() => efecto("destello", r.left + r.width * (.38 + Math.random() * .22) - 15, r.top + r.height * (.58 + Math.random() * .2) - 15, DESTELLO, 900), i * 110);
      Juegos.decir("¡Aaah! ¡Qué dientes tan limpios!"); sonido("cascabel");
      subir("dientes", 100); subir("carino", 4);
      await esperar(2000);
      michi.hidden = false;
      await terminarModo();
      estado("feliz sonrojado", 1400);
    }

    // ---------- Dormitorio (cama con mantita y primer plano llegan en la parte 2) ----------
    let cuna = [], zetas;
    function montarDormitorio() {
      deco(Casa.ventanaNoche, "left:5vw;top:10dvh;width:min(32vw,24dvh)");
      deco(Casa.cuadroPez, "right:8vw;top:12dvh;width:min(22vw,15dvh)");
      svgObj(Casa.alfombra("#9d7fd8"), "left:50%;transform:translateX(-50%);bottom:calc(var(--suelo) - 6dvh);width:min(92vw,70dvh);z-index:1");
      svgObj(Casa.camaGato, "left:50%;transform:translateX(-50%);bottom:calc(var(--suelo) - 4dvh);width:min(80vw,46dvh);z-index:2", { id: "cama" });
      svgObj(Casa.lampara, "right:3vw;bottom:calc(var(--suelo) + 14dvh);width:min(22vw,14dvh);z-index:3", { id: "lampara", etiqueta: "lámpara", alTocar: () => (durmiendo ? despertar() : dormir()) });
    }
    const CANCION = [[392, 1], [330, 1], [392, 2], [330, 1], [392, 1], [440, 1], [392, 1], [349, 1], [330, 2], [294, 1], [330, 1], [349, 2], [294, 1], [262, 3]];
    function tocarCuna() {
      let t = 0;
      cuna = CANCION.map(([f, d]) => { const id = setTimeout(() => Juegos.nota(f, 1.2), t); t += d * 520; return id; });
      cuna.push(setTimeout(() => durmiendo && tocarCuna(), t + 800));
    }
    function dormir() {
      if (ocupado) return;
      ultimoToque = Date.now(); quitarPensamiento();
      durmiendo = true;
      document.body.classList.add("oscuro");
      Juegos.decir("¡Buenas noches, Michi!");
      const cama = rectDe($("cama"));
      ponerMichi({ cx: cama.x + cama.w * .5, abajo: innerHeight - (cama.y + cama.h * .78), h: cama.h * 1.25 });
      michi.className = "duerme cerrados";
      tocarCuna();
      zetas = setInterval(() => { efecto("zeta", ...puntoMichi(150, 40), "z", 2400); subir("sueno", 6); }, 1300);
    }
    async function despertar(silencio) {
      durmiendo = false;
      clearInterval(zetas); cuna.forEach(clearTimeout); cuna = [];
      document.body.classList.remove("oscuro");
      michi.className = "";
      if (silencio) return;
      ocupado = true;
      ponerMichi(lugarInicial());
      estado("estirarse bosteza abierta cerrados", 1500); sonido("bostezo");
      await esperar(1500);
      estado("felices", 1500); Juegos.decir("¡Buenos días, Maya!");
      await esperar(1500);
      ocupado = false;
    }

    // ================= Pide lo que necesita (con gestos, sin drama) =================
    let pensamiento;
    function quitarPensamiento() { pensamiento?.remove(); pensamiento = null; }
    const GESTOS = {
      hambre: ["pancita", "¡Tengo hambre!", "cocina", null, "cocina"],
      limpieza: ["rascarse", "¡Quiero un baño de espuma!", "bano", "banera", "ducha"],
      bano: ["apurado", "¡Quiero ir al baño!", "bano", "inodoro", "bano"],
      sueno: ["bosteza abierta cerrados", "Tengo sueñito…", "dormitorio", null, "dormitorio"],
      dientes: ["abierta", "¡Mis dientes!", "bano", "dientes", "cepilloAzul"],
    };
    setInterval(() => {
      if (ocupado || durmiendo || pensamiento || modo) return;
      const k = Object.keys(GESTOS).filter(x => nivel[x] < BAJA).sort((a, b) => nivel[a] - nivel[b])[0];
      if (!k) return;
      const [clases, frase, destino, esc, icono] = GESTOS[k];
      estado(clases, 2000);
      if (k === "sueno") sonido("bostezo");
      Juegos.decir(frase);
      const r = svgMichi.getBoundingClientRect();
      pensamiento = document.createElement("button");
      pensamiento.className = "pensamiento";
      pensamiento.innerHTML = Michi.ICONOS[icono];
      pensamiento.setAttribute("aria-label", frase);
      pensamiento.style.cssText = `left:${Math.min(r.right - 30, innerWidth - 100)}px;top:${Math.max(r.top, 90)}px`;
      pensamiento.addEventListener("click", async () => { quitarPensamiento(); irA(destino); if (esc) { await esperar(300); escena(esc); } });
      document.body.appendChild(pensamiento);
      setTimeout(quitarPensamiento, 6000);
    }, 15000);

    // Bosteza si nadie juega con él un rato; en la sala, a veces juega solo con el ovillo
    setInterval(() => {
      if (ocupado || durmiendo || modo || Date.now() - ultimoToque < 25000) return;
      ultimoToque = Date.now();
      if (cuarto === "sala" && Math.random() < .5) { estado("zarpazo felices", 700); sonido("cascabel"); $("ovillo")?.dispatchEvent(new Event("rodar")); }
      else { estado("bosteza abierta cerrados", 1600); sonido("bostezo"); }
    }, 5000);

    async function festejar() {
      if (ocupado || durmiendo || modo) return;
      ocupado = true; todoLleno = true;
      estado("baila felices abierta", 3000); Juegos.fiesta(); Juegos.decir("¡Gracias por cuidarme, Maya!"); destellos(8);
      [0, 900, 1800].forEach(t => setTimeout(() => sonido("cascabel"), t));
      await esperar(3000);
      ocupado = false;
    }


    // ================= Inicio =================
    todoLleno = ["hambre", "limpieza", "bano", "sueno"].every(k => nivel[k] >= 95); // no festejar solo por abrir el juego
    irA("sala", true);
    pintarNecesidades();
    setTimeout(() => { if (!ocupado) { estado("saluda feliz", 1700); Juegos.decir("¡Hola, Maya! Soy Michi"); } }, 900);
  </script>
</body>
</html>
