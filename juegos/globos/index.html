<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#fff7ec">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Globos</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maya">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    body { overflow: hidden; background: linear-gradient(#bfe6ff, #fff7ec); }
    .globo {
      position: absolute;
      bottom: -220px;
      width: 120px;
      height: 145px;
      animation: subir linear forwards;
      filter: drop-shadow(-6px 6px 0 rgba(0, 0, 0, .08));
    }
    .globo svg { width: 100%; height: 100%; overflow: visible; }
    @keyframes subir { to { transform: translateY(calc(-100vh - 260px)); } }
    /* Al reventar: partículas del color del globo que salen en todas direcciones */
    .particula {
      position: fixed; width: 18px; height: 18px; border-radius: 50%;
      border: 3px solid var(--ink); pointer-events: none;
      animation: estallar .55s ease-out forwards;
    }
    @keyframes estallar { to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .particula { display: none; } }
    .contador {
      position: fixed; top: 20px; right: 20px;
      font-size: 44px; font-weight: 800;
      background: #fff; border-radius: 40px; padding: 4px 22px;
      box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
      display: flex; align-items: center; gap: 6px;
    }
    .contador .mini svg { width: 44px; height: 52px; display: block; }
  </style>
</head>
<body>
  <a class="btn-casa" href="../../" aria-label="Volver al menú">🏠</a>
  <div class="contador" id="contador"><span class="mini" id="mini"></span><span id="numero">0</span></div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/dibujos.js"></script>
  <script>
    const NOMBRES = { "#ff5a5f": "rojo", "#3fa7ff": "azul", "#ffd23f": "amarillo", "#4cd17a": "verde",
                      "#a66bff": "morado", "#ff9f43": "naranja", "#ff7eb6": "rosado" };
    let total = 0;
    const contador = document.getElementById("contador");
    const numero = document.getElementById("numero");
    document.getElementById("mini").innerHTML = Dibujos.globo("#ff5a5f");

    function estallar(g, color) {
      const r = g.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height * .4;
      g.remove();
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * Math.PI * 2, d = 70 + Math.random() * 40;
        const p = document.createElement("div");
        p.className = "particula";
        p.style.cssText = `left:${cx - 9}px;top:${cy - 9}px;background:${color};--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
      }
    }

    function crearGlobo() {
      const color = Juegos.azar(Juegos.COLORES);
      const g = document.createElement("div");
      g.className = "globo";
      g.innerHTML = Dibujos.globo(color);
      g.style.left = Math.random() * (innerWidth - 120) + "px";
      g.style.animationDuration = 6 + Math.random() * 4 + "s";
      g.addEventListener("pointerdown", () => {
        if (g.classList.contains("reventado")) return;
        Juegos.pop();
        Juegos.decir(NOMBRES[color]);
        g.classList.add("reventado");
        estallar(g, color);
        total++;
        numero.textContent = total;
        Juegos.animar(contador, "pop");
        if (total % 10 === 0) setTimeout(() => { Juegos.fiesta(); Juegos.decir("¡Muy bien, Maya!"); }, 400);
      });
      g.addEventListener("animationend", e => e.animationName === "subir" && g.remove());
      document.body.appendChild(g);
    }

    setInterval(crearGlobo, 1100);
    crearGlobo();
  </script>
</body>
</html>
