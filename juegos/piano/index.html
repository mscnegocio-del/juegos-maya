<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#fff7ec">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Piano</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maya">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    body { height: 100%; overflow: hidden; background: linear-gradient(#ffe3f1, #fff7ec); }
    .piano {
      position: fixed; inset: 104px 16px 24px;
      display: flex; gap: 10px;
      touch-action: none;
    }
    .tecla {
      flex: 1;
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding-top: 14px;
      border-radius: 22px 22px 30px 30px;
      box-shadow: 0 12px 0 rgba(0, 0, 0, .18), inset 0 -18px 0 rgba(0, 0, 0, .08);
      transition: transform .08s, box-shadow .08s, filter .08s;
      touch-action: none;
    }
    .tecla.tocada { transform: translateY(10px); box-shadow: 0 2px 0 rgba(0, 0, 0, .18), inset 0 -8px 0 rgba(0, 0, 0, .08); filter: brightness(1.15); }
    .tecla.guia { animation: brillar .5s ease-in-out infinite alternate; }
    @keyframes brillar { to { filter: brightness(1.3); box-shadow: 0 12px 0 rgba(0, 0, 0, .18), 0 0 0 6px #fff, 0 0 26px 8px #fff; } }
    .tecla .animal {
      width: min(80%, 90px); aspect-ratio: 1 / 1;
      position: relative; flex: none;
      background: #fff; border-radius: 50%;
      box-shadow: 0 5px 0 rgba(0, 0, 0, .12);
    }
    .tecla .animal svg { position: absolute; inset: 10%; width: 80%; height: 80%; overflow: visible; }
    .tecla.tocada .animal { animation: saltar .35s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes saltar { 40% { transform: translateY(-22px) scale(1.1); } }

    /* Celular en vertical: teclas horizontales apiladas, animal a la izquierda */
    @media (orientation: portrait) {
      .piano { flex-direction: column; gap: 8px; }
      .tecla { flex-direction: row; justify-content: flex-start; padding: 0 0 0 12px; border-radius: 22px 30px 30px 22px;
               box-shadow: 8px 0 0 rgba(0, 0, 0, .18), inset -18px 0 0 rgba(0, 0, 0, .08); }
      .tecla.tocada { transform: translateX(8px); box-shadow: 1px 0 0 rgba(0, 0, 0, .18), inset -8px 0 0 rgba(0, 0, 0, .08); }
      .tecla .animal { width: auto; height: 78%; max-height: 80px; }
    }

    .btn-cancion {
      position: fixed; top: 16px; right: 16px; z-index: 50;
      width: 72px; height: 72px; border-radius: 50%;
      background: #fff; display: grid; place-items: center;
      box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
      transition: transform .15s;
    }
    .btn-cancion:active { transform: scale(.9); }
    .btn-cancion svg { width: 46px; height: 46px; }
    .btn-cancion.sonando { animation: wiggle .5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .tecla.guia, .tecla.tocada .animal, .btn-cancion.sonando { animation: none; }
      .tecla.guia { filter: brightness(1.3); outline: 6px solid #fff; }
    }
  </style>
</head>
<body>
  <a class="btn-casa" href="../../" aria-label="Volver al menú">🏠</a>
  <button class="btn-cancion" id="cancion" aria-label="Tocar una canción"></button>
  <main class="piano" id="piano"></main>

  <script src="../../assets/vendor/gsap/gsap.min.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/dibujos.js"></script>
  <script>
    // Escala de do a si, en orden de arcoíris
    const TECLAS = [
      { color: "#ff5a5f", nombre: "rojo", freq: 261.63, animal: "vaca" },
      { color: "#ff9f43", nombre: "naranja", freq: 293.66, animal: "leon" },
      { color: "#ffd23f", nombre: "amarillo", freq: 329.63, animal: "pato" },
      { color: "#4cd17a", nombre: "verde", freq: 349.23, animal: "rana" },
      { color: "#3fa7ff", nombre: "azul", freq: 392.00, animal: "elefante" },
      { color: "#a66bff", nombre: "morado", freq: 440.00, animal: "gato" },
      { color: "#ff7eb6", nombre: "rosado", freq: 493.88, animal: "chancho" },
    ];
    // "Estrellita": do do sol sol la la sol · fa fa mi mi re re do (índice de tecla, duración en tiempos)
    const ESTRELLITA = [[0,1],[0,1],[4,1],[4,1],[5,1],[5,1],[4,2],[3,1],[3,1],[2,1],[2,1],[1,1],[1,1],[0,2]];
    const TIEMPO = 480; // ms

    const piano = document.getElementById("piano");
    const btnCancion = document.getElementById("cancion");
    btnCancion.innerHTML = Dibujos.notaMusical;
    let vozPendiente, cancion = null;

    function sonar(i) {
      const t = TECLAS[i], el = piano.children[i];
      Juegos.nota(t.freq);
      el.classList.remove("tocada");
      void el.offsetWidth;
      el.classList.add("tocada", "sonando");
      clearTimeout(el._soltar);
      el._soltar = setTimeout(() => el.classList.remove("tocada", "sonando"), 220);
    }

    // Si toca rápido, solo se dice el último color (la voz no corta las notas: van por Web Audio)
    function decirColor(i) {
      clearTimeout(vozPendiente);
      vozPendiente = setTimeout(() => Juegos.decir(`¡${TECLAS[i].nombre}!`), 260);
    }

    TECLAS.forEach((t, i) => {
      const b = document.createElement("button");
      b.className = "tecla";
      b.style.background = t.color;
      b.setAttribute("aria-label", t.nombre);
      b.innerHTML = `<span class="animal">${Dibujos.ANIMALES[t.animal]}</span>`;
      // pointerdown en vez de click: respuesta inmediata y un dedo por tecla (multitáctil)
      b.addEventListener("pointerdown", e => {
        e.preventDefault();
        detenerCancion();
        sonar(i);
        decirColor(i);
      });
      piano.appendChild(b);
    });

    function detenerCancion() {
      if (!cancion) return;
      cancion.forEach(clearTimeout);
      cancion = null;
      btnCancion.classList.remove("sonando");
      piano.querySelectorAll(".guia").forEach(t => t.classList.remove("guia"));
    }

    function tocarCancion() {
      if (cancion) return detenerCancion();
      cancion = [];
      btnCancion.classList.add("sonando");
      let t = 300;
      ESTRELLITA.forEach(([i, dur]) => {
        cancion.push(setTimeout(() => {
          piano.querySelectorAll(".guia").forEach(x => x.classList.remove("guia"));
          piano.children[i].classList.add("guia");
          sonar(i);
        }, t));
        t += dur * TIEMPO;
      });
      cancion.push(setTimeout(() => { detenerCancion(); Juegos.fiesta(); }, t));
    }

    btnCancion.addEventListener("click", () => { Juegos.decir("¡Estrellita!"); tocarCancion(); });
  </script>
</body>
</html>
