<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#fff7ec">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Animales</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maya">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    body { background: linear-gradient(#c9f0d3, #fff7ec); min-height: 100%; }
    .granja {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(190px, 42%), 1fr));
      gap: 18px;
      max-width: 860px;
      margin: 0 auto;
      padding: 104px 16px 110px;
    }
    .animal {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 8px 0 rgba(0, 0, 0, .1);
      padding: 6%;
      transition: transform .15s, box-shadow .15s;
    }
    .animal:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0, 0, 0, .1); }
    .animal svg { width: 100%; height: 100%; overflow: visible; display: block; }

    .animal:nth-child(3n+1) .ojos { animation-delay: -1.5s; }
    .animal:nth-child(3n+2) .ojos { animation-delay: -3s; }

    .burbuja {
      position: fixed; left: 50%; bottom: 24px;
      transform: translateX(-50%);
      background: #fff; border-radius: 40px; padding: 10px 28px;
      font-size: 34px; font-weight: 800; white-space: nowrap;
      box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
      opacity: 0; transition: opacity .2s;
      pointer-events: none;
    }
    .burbuja.ver { opacity: 1; }
  </style>
</head>
<body>
  <a class="btn-casa" href="../../" aria-label="Volver al menú">🏠</a>
  <main class="granja" id="granja"></main>
  <div class="burbuja" id="burbuja"></div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/dibujos.js"></script>
  <script>
    const DIBUJOS = Dibujos.ANIMALES;

    const ANIMALES = [
      { id: "vaca", nombre: "La vaca", sonido: "muuuu" },
      { id: "perro", nombre: "El perrito", sonido: "guau guau" },
      { id: "gato", nombre: "El gatito", sonido: "miau" },
      { id: "chancho", nombre: "El chanchito", sonido: "oink oink" },
      { id: "gallina", nombre: "La gallina", sonido: "clo clo clo" },
      { id: "gallo", nombre: "El gallo", sonido: "kikirikí" },
      { id: "oveja", nombre: "La ovejita", sonido: "beee" },
      { id: "pato", nombre: "El pato", sonido: "cuac cuac" },
      { id: "caballo", nombre: "El caballo", sonido: "iiiijiji" },
      { id: "leon", nombre: "El león", sonido: "groaaar" },
      { id: "rana", nombre: "La ranita", sonido: "croac croac" },
      { id: "elefante", nombre: "El elefante", sonido: "tuuuu" },
    ];

    const granja = document.getElementById("granja");
    const burbuja = document.getElementById("burbuja");
    const url = id => `../../assets/sonidos/animales/${id}.mp3`;
    let ocultar, activo;

    function terminar(boton) {
      boton.classList.remove("sonando");
      clearTimeout(ocultar);
      ocultar = setTimeout(() => burbuja.classList.remove("ver"), 1600);
    }

    ANIMALES.forEach(a => {
      Juegos.cargar(url(a.id)).catch(() => {}); // precarga; si falla se usa la voz
      const b = document.createElement("button");
      b.className = "animal";
      b.innerHTML = DIBUJOS[a.id];
      b.setAttribute("aria-label", a.nombre);
      b.addEventListener("click", () => {
        if (activo && activo !== b) activo.classList.remove("sonando");
        activo = b;
        window.speechSynthesis?.cancel();
        b.classList.add("sonando");
        burbuja.textContent = `¡${a.sonido}!`;
        burbuja.classList.add("ver");
        clearTimeout(ocultar);
        Juegos.sonar(url(a.id))
          .then(() => { terminar(b); Juegos.decir(`¡${a.nombre}!`); })
          .catch(() => { Juegos.decir(`${a.nombre} hace ${a.sonido}`); setTimeout(() => terminar(b), 1800); });
      });
      granja.appendChild(b);
    });
  </script>
</body>
</html>
