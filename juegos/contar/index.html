<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#fff7ec">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Contar</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maya">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    body {
      min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 100px 16px 40px;
      background: linear-gradient(#ffe9c7, #fff7ec);
    }
    .contador {
      font-size: clamp(64px, 16vw, 110px); font-weight: 800; line-height: 1;
      min-height: 1em; color: var(--naranja);
      text-shadow: 0 6px 0 rgba(0, 0, 0, .1);
    }
    .mesa {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 18px;
      max-width: 760px; margin-top: 24px;
    }
    .objeto {
      position: relative;
      width: clamp(120px, 30vw, 150px); aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 8px 0 rgba(0, 0, 0, .1);
      transition: transform .2s, background .2s;
    }
    .objeto svg { position: absolute; inset: 10%; width: 80%; height: 80%; overflow: visible; }
    .objeto.contado { background: #fff4d6; }
    .objeto.contado svg { animation: saltar .45s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes saltar { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-26px) scale(1.12); } 100% { transform: none; } }
    .numero {
      position: absolute; top: -12px; right: -12px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--naranja); color: #fff;
      font-size: 30px; font-weight: 800; line-height: 48px; text-align: center;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .15);
    }
    @media (prefers-reduced-motion: reduce) { .objeto.contado svg { animation: none; } }
  </style>
</head>
<body>
  <a class="btn-casa" href="../../" aria-label="Volver al menú">🏠</a>
  <div class="contador" id="contador" aria-live="polite"></div>
  <div class="mesa" id="mesa"></div>

  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/dibujos.js"></script>
  <script>
    const OBJETOS = Dibujos.OBJETOS_CONTAR;

    const NUMEROS = ["uno", "dos", "tres", "cuatro", "cinco"];
    const TOTAL_FEMENINO = ["una", "dos", "tres", "cuatro", "cinco"]; // "¡Una manzana!"
    const mesa = document.getElementById("mesa");
    const contador = document.getElementById("contador");
    let rondas = 0, cuenta = 0, total = 0, objeto;

    function nuevaRonda() {
      // Empieza con 1 a 3; tras 3 rondas completas puede llegar a 5
      const max = rondas < 3 ? 3 : 5;
      const min = rondas < 3 ? 1 : 2;
      total = min + Math.floor(Math.random() * (max - min + 1));
      cuenta = 0;
      objeto = Juegos.azar(OBJETOS.filter(o => o !== objeto));
      contador.textContent = "";
      mesa.innerHTML = "";
      for (let i = 0; i < total; i++) {
        const b = document.createElement("button");
        b.className = "objeto pop";
        b.innerHTML = objeto.dibujo;
        b.setAttribute("aria-label", objeto.nombre);
        b.addEventListener("click", () => tocar(b));
        mesa.appendChild(b);
      }
      Juegos.decir(total === 1 ? `¡Toca la ${objeto.nombre}!` : `¡Vamos a contar las ${objeto.plural}!`);
    }

    function tocar(b) {
      if (b.classList.contains("contado") || cuenta >= total) {
        Juegos.animar(b.querySelector("svg"), "wiggle"); // ya contado: no vuelve a contar
        return;
      }
      cuenta++;
      b.classList.add("contado");
      b.insertAdjacentHTML("beforeend", `<span class="numero">${cuenta}</span>`);
      contador.textContent = cuenta;
      Juegos.animar(contador, "pop");
      Juegos.tono(440 + cuenta * 90, 0.15, "triangle");
      Juegos.decir(NUMEROS[cuenta - 1]);

      if (cuenta === total) {
        rondas++;
        setTimeout(() => {
          Juegos.fiesta();
          Juegos.decir(`¡${TOTAL_FEMENINO[total - 1]} ${total === 1 ? objeto.nombre : objeto.plural}!`);
        }, 700);
        setTimeout(nuevaRonda, 3200);
      }
    }

    nuevaRonda();
  </script>
</body>
</html>
