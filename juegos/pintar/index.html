<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#fff7ec">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pintar</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../assets/iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maya">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    body { min-height: 100%; background: linear-gradient(#efe4ff, #fff7ec); }
    [hidden] { display: none !important; }

    /* ---------- Galería ---------- */
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(150px, 42%), 1fr));
      gap: 16px;
      max-width: 900px; margin: 0 auto;
      padding: 104px 16px 32px;
    }
    .tarjeta {
      aspect-ratio: 1 / 1; position: relative;
      background: #fff; border-radius: var(--radius);
      box-shadow: 0 8px 0 rgba(0, 0, 0, .1);
      transition: transform .15s;
    }
    .tarjeta:active { transform: translateY(6px); }
    .tarjeta svg { position: absolute; inset: 8%; width: 84%; height: 84%; overflow: visible; }
    /* Sorpresa del día: la tarjeta viene envuelta como regalo hasta que Maya la toca */
    .tarjeta .regalo { position: absolute; inset: 0; border-radius: var(--radius); background: var(--rosa); overflow: hidden; z-index: 2;
                       background-image: radial-gradient(circle at 25% 30%, #ffffff55 0 6px, transparent 7px), radial-gradient(circle at 70% 70%, #ffffff55 0 6px, transparent 7px);
                       background-size: 40px 40px; }
    .tarjeta .regalo::before { content: ""; position: absolute; left: 42%; width: 16%; top: 0; bottom: 0; background: var(--amarillo); }
    .tarjeta .regalo::after { content: ""; position: absolute; top: 42%; height: 16%; left: 0; right: 0; background: var(--amarillo); }
    .tarjeta .rotulo { position: absolute; left: 0; right: 0; bottom: -2px; text-align: center; font-weight: 800; font-size: 18px; color: var(--ink); }
    .tarjeta.especial { background: #fff3c4; }

    /* Elegir: seguir pintando o empezar en blanco */
    .eleccion { position: fixed; inset: 0; z-index: 40; background: rgba(59, 42, 74, .55); display: grid; place-items: center; padding: 16px; }
    .eleccion .caja { display: flex; gap: 22px; background: #fff; border-radius: 32px; padding: 22px; box-shadow: 0 10px 0 rgba(0, 0, 0, .15); }
    .eleccion button { width: clamp(120px, 36vw, 190px); aspect-ratio: 1 / 1; border-radius: 28px; background: #fff7ec; position: relative;
                       box-shadow: 0 6px 0 rgba(0, 0, 0, .12); }
    .eleccion button svg { position: absolute; inset: 10%; width: 80%; height: 80%; }
    .barrido { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #fff 30% 70%, transparent); z-index: 5; pointer-events: none; }

    /* ---------- Editor ---------- */
    .editor {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 96px 12px 12px;
    }
    .lienzo {
      position: relative; flex: none;
      width: min(calc(100vw - 24px), calc(100dvh - 380px));
      aspect-ratio: 1 / 1;
      background: #fff; border-radius: 24px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, .1);
      overflow: hidden;
      touch-action: none;
    }
    .lienzo > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    .lineas { pointer-events: none; }
    .destello { animation: destello .3s ease-out; }
    @keyframes destello { from { opacity: .4; } }
    .lienzo.balde canvas { pointer-events: none; } /* con el balde se toca la zona del SVG de abajo */
    .lienzo.vivo { animation: vivir .6s ease-in-out 3 alternate; }
    @keyframes vivir { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.05); } }

    .herramientas {
      display: flex; flex-direction: column; gap: 10px; align-items: center;
      width: min(100%, 640px);
    }
    .fila { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    /* Colores y herramientas en una fila que se desliza: botones grandes (≥ 72 px) aunque haya muchos */
    .fila.desliza { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; width: 100%; padding: 6px 8px 10px;
                    scroll-snap-type: x proximity; touch-action: pan-x; scrollbar-width: none; }
    .fila.desliza::-webkit-scrollbar { display: none; }
    .fila.desliza > * { flex: none; scroll-snap-align: start; }
    .color, .herr {
      width: 72px; height: 72px; border-radius: 50%;
      box-shadow: 0 4px 0 rgba(0, 0, 0, .15);
      transition: transform .12s;
    }
    .color.activo { transform: scale(1.22); outline: 4px solid #fff; outline-offset: -4px; }
    .herr { background: #fff; display: grid; place-items: center; }
    .herr svg { width: 46px; height: 46px; }
    .color.blanco { box-shadow: inset 0 0 0 3px #e5ded4, 0 4px 0 rgba(0, 0, 0, .15); }
    .lienzo.brilla canvas { animation: titilar 1.6s ease-in-out infinite alternate; }
    @keyframes titilar { to { filter: brightness(1.12) saturate(1.15); } }
    .herr.activo { background: var(--amarillo); transform: scale(1.12); }
    .herr:active, .color:active { transform: scale(.9); }
    .grosor { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center;
              box-shadow: 0 4px 0 rgba(0, 0, 0, .12); }
    .grosor span { display: block; border-radius: 50%; background: var(--ink); }
    .grosor.activo { background: var(--amarillo); }
    .herr.listo { background: #e9fbef; }

    @media (orientation: landscape) and (min-width: 700px) {
      .editor { flex-direction: row; padding: 96px 16px 16px; gap: 20px; }
      .lienzo { width: min(calc(100dvh - 112px), calc(100vw - 360px)); }
      .herramientas { width: 300px; }
    }
    @media (prefers-reduced-motion: reduce) { .lienzo.vivo, .lienzo.brilla canvas { animation: none; } }
  </style>
</head>
<body>
  <a class="btn-casa" href="../../" id="casa" aria-label="Volver">🏠</a>

  <main class="galeria" id="galeria"></main>

  <section class="editor" id="editor" hidden>
    <div class="lienzo balde" id="lienzo">
      <svg class="zonas" id="zonas" viewBox="0 0 200 200"></svg>
      <canvas id="trazos" width="800" height="800"></canvas>
      <svg class="lineas" id="lineas" viewBox="0 0 200 200"></svg>
    </div>
    <div class="herramientas">
      <div class="fila desliza" id="colores"></div>
      <div class="fila" id="grosores"></div>
      <div class="fila desliza" id="sellos" hidden></div>
      <div class="fila desliza" id="botones"></div>
    </div>
  </section>

  <script src="../../assets/vendor/gsap/gsap.min.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/dibujos.js"></script>
  <script src="../../assets/js/colorear.js"></script>
  <script>
    const { DIBUJOS, ICONOS } = Colorear;
    const TRAZO = 'stroke="#3b2a4a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
    const HOJA = { id: "hoja", nombre: "una hoja en blanco", zonas: ['path d="M0 0 L200 0 L200 200 L0 200Z"'], detalles: "", hoja: true };
    const TODOS = [HOJA, ...DIBUJOS];
    const COLORES = [
      ["#ff5a5f", "rojo"], ["#ff9f43", "naranja"], ["#ffd23f", "amarillo"], ["#4cd17a", "verde"], ["#3fa7ff", "azul"],
      ["#a66bff", "morado"], ["#ff7eb6", "rosado"], ["#9fdcff", "celeste"], ["#ffc8dc", "rosado clarito"], ["#a0673f", "café"],
      ["#f5c9a0", "color piel"], ["#a9a7b4", "gris"], ["#3b2a4a", "negro"], ["#ffffff", "blanco"],
    ];
    const { SELLOS } = Colorear;
    const conXmlns = s => s.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
    SELLOS.pato = { nombre: "el pato", svg: conXmlns(Dibujos.ANIMALES.pato) };
    SELLOS.michi = { nombre: "Michi", svg: conXmlns(Dibujos.ANIMALES.gato) };
    // Cada sello se prepara una vez como imagen para pegarlo en el canvas al instante
    Object.values(SELLOS).forEach(s => { s.img = new Image(); s.img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.svg); });
    let sello = "estrella", tono = 0, mascara = null;
    const GROSORES = [14, 28, 50]; // en unidades del canvas (800 px)

    const $ = id => document.getElementById(id);
    const galeria = $("galeria"), editor = $("editor"), lienzo = $("lienzo");
    const svgZonas = $("zonas"), svgLineas = $("lineas"), canvas = $("trazos"), ctx = canvas.getContext("2d");
    const casa = $("casa");
    ctx.lineCap = ctx.lineJoin = "round";

    // ---------- Guardado (por dispositivo; si falla, se juega igual sin guardar) ----------
    const clave = id => `maya.colorear.${id}`;
    function leer(id) { try { return JSON.parse(localStorage.getItem(clave(id))) || {}; } catch { return {}; } }
    function escribir(id, datos) { try { localStorage.setItem(clave(id), JSON.stringify(datos)); } catch {} }
    const borrar = id => { try { localStorage.removeItem(clave(id)); } catch {} };
    const pintado = datos => !!(datos.trazo || Object.keys(datos.rellenos || {}).length);

    // "Mis dibujos": copias guardadas antes de limpiar una hoja (máx. 20; la más antigua se va)
    const MAX_COPIAS = 20;
    const leerCopias = () => { const c = leer("copias"); return Array.isArray(c) ? c : []; };
    function guardarCopia(id, datos) {
      if (!pintado(datos)) return;
      const copias = leerCopias(), t = Date.now();
      escribir("copia:" + t, { ...datos, base: id });
      copias.unshift({ t, id });
      while (copias.length > MAX_COPIAS) { borrar("copia:" + copias.pop().t); Juegos.decir("Guardé tu dibujo. El más viejito se fue"); }
      escribir("copias", copias);
    }

    // Contornos visibles: cada zona oculta (con una máscara) la parte de su borde que queda debajo de
    // las zonas siguientes, como en un libro de colorear donde no se ven las líneas tapadas
    let nMascara = 0;
    function contornos(d) {
      if (d.hoja) return "";
      const pre = `m${++nMascara}-`;
      const defs = d.zonas.map((_, i) => i === d.zonas.length - 1 ? "" :
        `<mask id="${pre}${i}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="240" height="240">
          <rect x="-20" y="-20" width="240" height="240" fill="#fff"/>
          ${d.zonas.slice(i + 1).map(z => `<${z} fill="#000" stroke="none"/>`).join("")}
        </mask>`).join("");
      const lineas = d.zonas.map((z, i) => `<${z} fill="none"${i < d.zonas.length - 1 ? ` mask="url(#${pre}${i})"` : ""}/>`).join("");
      return `<defs>${defs}</defs>${lineas}${d.detalles}`;
    }

    // Un dibujo como SVG completo: relleno + trazos guardados + líneas encima (para las miniaturas)
    function svgCompleto(d, datos = {}) {
      const rellenos = d.zonas.map((z, i) => `<${z} fill="${datos.rellenos?.[i] || "#fff"}" stroke="none"/>`).join("");
      const trazo = datos.trazo ? `<image href="${datos.trazo}" width="200" height="200"/>` : "";
      const lineas = contornos(d);
      const borde = d.hoja ? `<rect x="2" y="2" width="196" height="196" rx="16" fill="none" stroke-dasharray="12 10"/>` : "";
      return `<svg viewBox="0 0 200 200" ${TRAZO} aria-hidden="true">${rellenos}${trazo}${lineas}${borde}</svg>`;
    }

    // Sorpresa del día: el mismo dibujo todo el día, distinto cada día
    const hoy = new Date().toISOString().slice(0, 10);
    const sorpresaDeHoy = () => DIBUJOS[[...hoy].reduce((s, ch) => s * 31 + ch.charCodeAt(0), 7) % DIBUJOS.length];

    function tarjeta(html, etiqueta, alTocar, clase = "") {
      const b = document.createElement("button");
      b.className = "tarjeta pop " + clase;
      b.setAttribute("aria-label", etiqueta);
      b.innerHTML = html;
      b.addEventListener("click", () => alTocar(b));
      galeria.appendChild(b);
      return b;
    }
    const decirNombre = d => Juegos.decir(`¡${d.nombre[0].toUpperCase()}${d.nombre.slice(1)}!`);

    // Hoja en blanco y "mis dibujos" siempre al inicio; luego la sorpresa del día y el resto en orden aleatorio
    function mostrarGaleria() {
      galeria.innerHTML = "";
      tarjeta(svgCompleto(HOJA, leer(HOJA.id)), HOJA.nombre, () => { decirNombre(HOJA); abrir(HOJA); });
      if (leerCopias().length) tarjeta(ICONOS.carpeta + `<span class="rotulo"></span>`, "mis dibujos", mostrarCopias, "especial");
      const sorpresa = sorpresaDeHoy(), abierta = leer("sorpresa") === hoy;
      const ts = tarjeta(svgCompleto(sorpresa, leer(sorpresa.id)) + (abierta ? "" : `<span class="regalo"></span>`), "sorpresa del día", b => {
        const regalo = b.querySelector(".regalo");
        if (!regalo) { decirNombre(sorpresa); return abrir(sorpresa); }
        escribir("sorpresa", hoy);
        Juegos.decir(`¡Sorpresa! ¡${sorpresa.nombre}!`); Juegos.fiesta();
        if (window.gsap && !matchMedia("(prefers-reduced-motion: reduce)").matches)
          gsap.to(regalo, { y: -40, rotation: 20, scale: 1.2, opacity: 0, duration: .6, ease: "back.in(1.6)", onComplete: () => { regalo.remove(); setTimeout(() => abrir(sorpresa), 500); } });
        else { regalo.remove(); setTimeout(() => abrir(sorpresa), 500); }
      });
      Juegos.mezclar(DIBUJOS.filter(d => d !== sorpresa)).forEach(d =>
        tarjeta(svgCompleto(d, leer(d.id)), d.nombre, () => { decirNombre(d); abrir(d); }));
      if (window.gsap && !matchMedia("(prefers-reduced-motion: reduce)").matches)
        gsap.from(galeria.children, { scale: .6, opacity: 0, duration: .4, stagger: .03, ease: "back.out(1.8)", clearProps: "transform,opacity" });
      editor.hidden = true;
      galeria.hidden = false;
      casa.setAttribute("aria-label", "Volver al menú");
      vista = "galeria";
    }

    // Mis dibujos: las copias guardadas; tocar una la abre para seguir pintándola
    function mostrarCopias() {
      Juegos.decir("¡Mis dibujos!");
      galeria.innerHTML = "";
      leerCopias().forEach(({ t, id }) => {
        const d = TODOS.find(x => x.id === id);
        if (d) tarjeta(svgCompleto(d, leer("copia:" + t)), d.nombre, () => { decirNombre(d); abrir(d, "copia:" + t, true); });
      });
      vista = "copias";
      editor.hidden = true; galeria.hidden = false;
      casa.setAttribute("aria-label", "Volver a los dibujos");
    }

    // ---------- Editor ----------
    let actual, doc, vista = "galeria", rellenos, color = COLORES[0][0], herramienta = "balde", grosor = GROSORES[1], historial = [];

    // Si el dibujo ya tiene pintura, primero se elige: seguir pintando o empezar en blanco
    function abrir(d, id = d.id, directo = false) {
      const datos = leer(id);
      if (directo || !pintado(datos)) return cargar(d, id);
      const el = document.createElement("div");
      el.className = "eleccion";
      el.innerHTML = `<div class="caja"><button data-o="seguir" aria-label="seguir pintando">${svgCompleto(d, datos)}</button>
        <button data-o="blanco" aria-label="empezar en blanco">${svgCompleto(d)}</button></div>`;
      document.body.appendChild(el);
      Juegos.decir("¿Seguimos pintando, o empezamos en blanco?");
      el.addEventListener("click", e => {
        const o = e.target.closest("button")?.dataset.o;
        if (!o) return;
        el.remove();
        if (o === "blanco") { guardarCopia(d.id, datos); borrar(id); Juegos.decir("¡Hoja nueva! Tu dibujo quedó guardado"); }
        else Juegos.decir("¡A seguir pintando!");
        cargar(d, id);
      });
    }

    function cargar(d, id) {
      actual = d; doc = id;
      const datos = leer(id);
      lienzo.classList.toggle("brilla", !!datos.brillo);
      rellenos = datos.rellenos ? { ...datos.rellenos } : {};
      historial = [];
      svgZonas.innerHTML = d.zonas.map((z, i) => `<${z} data-zona="${i}" fill="${rellenos[i] || "#fff"}"/>`).join("");
      svgLineas.innerHTML = d.hoja ? "" : `<g ${TRAZO}>${contornos(d)}</g>`;
      ctx.clearRect(0, 0, 800, 800);
      if (datos.trazo) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, 800, 800); img.src = datos.trazo; }
      elegirHerramienta(d.hoja ? "pincel" : "balde", true);
      galeria.hidden = true;
      editor.hidden = false;
      casa.setAttribute("aria-label", "Volver a los dibujos");
      scrollTo(0, 0);
    }

    function guardar() {
      if (!actual) return;
      const vacio = !ctx.getImageData(0, 0, 800, 800).data.some((v, i) => i % 4 === 3 && v);
      escribir(doc, { ...leer(doc), rellenos, trazo: vacio ? null : canvas.toDataURL("image/png"), brillo: !vacio && lienzo.classList.contains("brilla") });
    }

    // La casita: desde el editor vuelve a la galería (guardando); desde la galería, al menú
    casa.addEventListener("click", e => {
      if (editor.hidden) return;
      e.preventDefault();
      guardar();
      vista === "copias" ? mostrarCopias() : mostrarGaleria();
    });
    addEventListener("pagehide", guardar);

    function recordar(paso) { historial.push(paso); if (historial.length > 20) historial.shift(); }

    // Balde: rellenar la zona tocada
    svgZonas.addEventListener("pointerdown", e => {
      const zona = e.target.closest("[data-zona]");
      if (!zona || (herramienta !== "balde" && herramienta !== "goma")) return;
      const i = zona.dataset.zona, nuevo = herramienta === "goma" ? "#fff" : color;
      if ((rellenos[i] || "#fff") === nuevo) return;
      recordar({ tipo: "zona", i, antes: rellenos[i] });
      rellenos[i] = nuevo;
      zona.setAttribute("fill", nuevo);
      Juegos.animar(zona, "destello"); // solo opacidad: no pisa el transform de las zonas rotadas
      Juegos.tono(500 + Math.random() * 300, 0.12, "sine", 0.2);
    });

    // Pincel, estrellitas y goma sobre el canvas
    const trazos = new Map();
    const punto = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * 800 / r.width, (e.clientY - r.top) * 800 / r.height]; };

    function estrellita(x, y) {
      const r = 18 + Math.random() * 22, giro = Math.random() * Math.PI;
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const a = giro + k * Math.PI / 5, rr = k % 2 ? r * .45 : r;
        ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      ctx.closePath();
      ctx.fillStyle = Juegos.azar(COLORES.slice(0, 7))[0];
      ctx.strokeStyle = "#3b2a4a"; ctx.lineWidth = 5;
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    canvas.addEventListener("pointerdown", e => {
      if (herramienta === "balde") return;
      canvas.setPointerCapture(e.pointerId);
      if (!trazos.size) recordar({ tipo: "canvas", imagen: ctx.getImageData(0, 0, 800, 800) });
      const [x, y] = punto(e);
      trazos.set(e.pointerId, { x, y, n: 0, movio: false });
      if (herramienta === "estrellas") { estrellita(x, y); Juegos.tono(800 + Math.random() * 600, 0.1); }
      if (herramienta === "sellos") pegarSello(x, y);
      mascara = herramienta === "magico" ? mascaraZona(e) : null;
    });
    canvas.addEventListener("pointermove", e => {
      const t = trazos.get(e.pointerId);
      if (!t) return;
      const [x, y] = punto(e);
      t.movio = true;
      if (herramienta === "sellos") { /* un sello por toque */ }
      else if (herramienta === "estrellas") {
        if (++t.n % 5 === 0) estrellita(x, y);
      } else if (herramienta === "brillitos") {
        brillos(t.x, t.y, x, y);
      } else if (herramienta === "magico" && mascara) {
        trazoMagico(t.x, t.y, x, y);
      } else if (herramienta === "arcoiris") {
        tono = (tono + 14) % 360;
        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = `hsl(${tono} 90% 60%)`; ctx.lineWidth = grosor;
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(x, y); ctx.stroke();
      } else {
        ctx.globalCompositeOperation = herramienta === "goma" ? "destination-out" : "source-over";
        ctx.strokeStyle = color;
        ctx.lineWidth = herramienta === "goma" ? grosor * 1.6 : grosor;
        ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(x, y); ctx.stroke();
      }
      t.x = x; t.y = y;
    });
    function soltar(e) {
      const t = trazos.get(e.pointerId);
      if (!t) return;
      trazos.delete(e.pointerId);
      if (!t.movio && (herramienta === "pincel" || herramienta === "magico" || herramienta === "arcoiris")) { // un toque sin mover deja un punto
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = color; ctx.beginPath(); ctx.arc(t.x, t.y, grosor / 2, 0, Math.PI * 2); ctx.fill();
      }
      if (!t.movio && herramienta === "goma") { // un toque con la goma también despinta la zona de abajo
        canvas.style.pointerEvents = "none";
        const debajo = document.elementFromPoint(e.clientX, e.clientY);
        canvas.style.pointerEvents = "";
        if (debajo?.dataset?.zona !== undefined) debajo.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
      }
    }
    ["pointerup", "pointercancel"].forEach(ev => canvas.addEventListener(ev, soltar));

    // Sellos: estrellita, corazón, huellita, florcita, el pato y Michi, grandes y con "pop"
    function pegarSello(x, y) {
      const s = SELLOS[sello], tam = 150;
      ctx.save(); ctx.globalCompositeOperation = "source-over";
      ctx.translate(x, y); ctx.rotate((Math.random() - .5) * .5);
      ctx.drawImage(s.img, -tam / 2, -tam / 2, tam, tam);
      ctx.restore();
      Juegos.pop(); Juegos.tono(700 + Math.random() * 300, .08, "triangle", .12);
    }

    // Brillitos: trazo suave del color elegido sembrado de destellos; la hoja titila un poquito
    function brillos(x0, y0, x1, y1) {
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = .65; ctx.strokeStyle = color; ctx.lineWidth = grosor;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.globalAlpha = 1;
      for (let k = 0; k < 4; k++) {
        const px = x1 + (Math.random() - .5) * grosor * 1.4, py = y1 + (Math.random() - .5) * grosor * 1.4, r = 6 + Math.random() * 10;
        ctx.fillStyle = Juegos.azar(["#fff", "#fff8c4", "#ffd23f", "#ffc8dc", "#c8f0ff"]);
        ctx.beginPath();
        for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .35 : r; ctx.lineTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr); }
        ctx.fill();
      }
      lienzo.classList.add("brilla");
    }

    // Pincel mágico: la forma de la zona donde empezó el trazo (menos las zonas que la tapan) hace de molde
    const capa = document.createElement("canvas"); capa.width = capa.height = 800;
    const cc = capa.getContext("2d"); cc.lineCap = cc.lineJoin = "round";
    function formaZona(el) {
      const p = new Path2D(), n = el.tagName;
      if (n === "path") p.addPath(new Path2D(el.getAttribute("d")));
      else {
        const v = k => +el.getAttribute(k);
        n === "circle" ? p.arc(v("cx"), v("cy"), v("r"), 0, Math.PI * 2) : p.ellipse(v("cx"), v("cy"), v("rx"), v("ry"), 0, 0, Math.PI * 2);
      }
      const m = el.transform.baseVal.consolidate()?.matrix;
      const f = new Path2D(); f.addPath(p, new DOMMatrix().scale(4).multiply(m ? DOMMatrix.fromMatrix(m) : new DOMMatrix()));
      return f;
    }
    function mascaraZona(e) {
      canvas.style.pointerEvents = "none";
      const zona = document.elementFromPoint(e.clientX, e.clientY)?.closest?.("[data-zona]");
      canvas.style.pointerEvents = "";
      if (!zona) return null;
      const m = document.createElement("canvas"); m.width = m.height = 800;
      const mc = m.getContext("2d");
      mc.fillStyle = "#000"; mc.fill(formaZona(zona));
      mc.globalCompositeOperation = "destination-out";
      [...svgZonas.querySelectorAll("[data-zona]")].filter(z => +z.dataset.zona > +zona.dataset.zona).forEach(z => mc.fill(formaZona(z)));
      return m;
    }
    function trazoMagico(x0, y0, x1, y1) {
      cc.globalCompositeOperation = "source-over";
      cc.clearRect(0, 0, 800, 800);
      cc.strokeStyle = color; cc.lineWidth = grosor;
      cc.beginPath(); cc.moveTo(x0, y0); cc.lineTo(x1, y1); cc.stroke();
      cc.globalCompositeOperation = "destination-in";
      cc.drawImage(mascara, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.drawImage(capa, 0, 0);
    }

    function deshacer() {
      const paso = historial.pop();
      if (!paso) { Juegos.animar(document.querySelector('[data-herr="deshacer"]'), "wiggle"); return; }
      if (paso.tipo === "todo") {
        rellenos = paso.rellenos;
        svgZonas.querySelectorAll("[data-zona]").forEach(z => z.setAttribute("fill", rellenos[z.dataset.zona] || "#fff"));
        ctx.putImageData(paso.imagen, 0, 0);
      } else if (paso.tipo === "zona") {
        if (paso.antes) rellenos[paso.i] = paso.antes; else delete rellenos[paso.i];
        svgZonas.querySelector(`[data-zona="${paso.i}"]`).setAttribute("fill", paso.antes || "#fff");
      } else {
        ctx.putImageData(paso.imagen, 0, 0);
      }
      Juegos.tono(300, 0.15, "triangle", 0.15);
    }

    // Hoja nueva: guarda una copia en "mis dibujos", barre la hoja y la deja en blanco (se puede deshacer)
    function hojaNueva() {
      const vacio = !Object.keys(rellenos).length && !ctx.getImageData(0, 0, 800, 800).data.some((v, i) => i % 4 === 3 && v);
      if (vacio) { Juegos.decir("¡La hoja ya está en blanco!"); return; }
      guardar();
      guardarCopia(actual.id, leer(doc));
      recordar({ tipo: "todo", rellenos: { ...rellenos }, imagen: ctx.getImageData(0, 0, 800, 800) });
      const limpiar = () => {
        rellenos = {};
        svgZonas.querySelectorAll("[data-zona]").forEach(z => z.setAttribute("fill", "#fff"));
        ctx.clearRect(0, 0, 800, 800);
        lienzo.classList.remove("brilla");
        guardar();
      };
      Juegos.decir("¡Hoja nueva!");
      Juegos.tono(900, .25, "sine", .12);
      if (window.gsap && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const b = document.createElement("div"); b.className = "barrido"; lienzo.appendChild(b);
        gsap.fromTo(b, { xPercent: -100 }, { xPercent: 100, duration: .7, ease: "power1.inOut", onComplete: () => b.remove() });
        setTimeout(limpiar, 350);
      } else limpiar();
    }

    // Terminado: el dibujo "cobra vida" (se mueve y suena su animal si lo tiene)
    function terminar() {
      guardar();
      Juegos.animar(lienzo, "vivo");
      Juegos.fiesta();
      if (actual.sonido) Juegos.sonar(`../../assets/sonidos/animales/${actual.sonido}.mp3`).then(() => Juegos.decir("¡Qué bonito, Maya!")).catch(() => Juegos.decir("¡Qué bonito, Maya!"));
      else Juegos.decir("¡Qué bonito, Maya!");
    }

    // ---------- Barra de herramientas ----------
    const NOMBRES_HERR = { balde: "¡A rellenar!", pincel: "¡Pincel!", estrellas: "¡Estrellitas!", goma: "¡Goma! Toca o frota para despintar",
      arcoiris: "¡Pincel arcoíris!", brillitos: "¡Brillitos!", magico: "¡Pincel mágico! No se sale de las líneas", sellos: "¡Sellos! Toca para pegar" };
    function elegirHerramienta(h, silencio) {
      herramienta = h;
      lienzo.classList.toggle("balde", h === "balde");
      document.querySelectorAll("[data-herr]").forEach(b => b.classList.toggle("activo", b.dataset.herr === h));
      $("grosores").hidden = !["pincel", "goma", "arcoiris", "brillitos", "magico"].includes(h);
      $("sellos").hidden = h !== "sellos";
      if (!silencio) Juegos.decir(NOMBRES_HERR[h]);
    }

    COLORES.forEach(([c, nombre], i) => {
      const b = document.createElement("button");
      b.className = "color" + (i === 0 ? " activo" : "") + (c === "#ffffff" ? " blanco" : "");
      b.style.background = c;
      b.setAttribute("aria-label", nombre);
      b.addEventListener("click", () => {
        color = c;
        document.querySelectorAll(".color").forEach(x => x.classList.toggle("activo", x === b));
        if (["goma", "estrellas", "sellos", "arcoiris"].includes(herramienta)) elegirHerramienta(actual?.hoja ? "pincel" : "balde", true);
        Juegos.decir(nombre);
      });
      $("colores").appendChild(b);
    });

    GROSORES.forEach((g, i) => {
      const b = document.createElement("button");
      b.className = "grosor" + (i === 1 ? " activo" : "");
      b.setAttribute("aria-label", ["delgado", "mediano", "grueso"][i]);
      b.innerHTML = `<span style="width:${8 + i * 8}px;height:${8 + i * 8}px"></span>`;
      b.addEventListener("click", () => { grosor = g; document.querySelectorAll(".grosor").forEach(x => x.classList.toggle("activo", x === b)); });
      $("grosores").appendChild(b);
    });

    Object.entries(SELLOS).forEach(([id, s]) => {
      const b = document.createElement("button");
      b.className = "herr"; b.dataset.sello = id; b.setAttribute("aria-label", s.nombre);
      b.innerHTML = s.svg;
      b.addEventListener("click", () => {
        sello = id; Juegos.decir(s.nombre);
        document.querySelectorAll("[data-sello]").forEach(x => x.classList.toggle("activo", x === b));
      });
      $("sellos").appendChild(b);
    });
    document.querySelector("[data-sello]").classList.add("activo");

    [["balde", "rellenar"], ["pincel", "pincel"], ["magico", "pincel mágico"], ["arcoiris", "pincel arcoíris"], ["brillitos", "brillitos"],
     ["sellos", "sellos"], ["estrellas", "estrellitas"], ["goma", "goma"], ["deshacer", "deshacer"], ["escoba", "hoja nueva"], ["listo", "terminar"]]
      .forEach(([h, etiqueta]) => {
        const b = document.createElement("button");
        b.className = "herr" + (h === "listo" ? " listo" : "");
        b.dataset.herr = h;
        b.setAttribute("aria-label", etiqueta);
        b.innerHTML = ICONOS[h];
        if (h === "deshacer") {
          // mantener presionado deshace varios pasos seguidos
          let repetir;
          b.addEventListener("pointerdown", () => { deshacer(); repetir = setTimeout(function otra() { deshacer(); repetir = setTimeout(otra, 280); }, 600); });
          ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => clearTimeout(repetir)));
        } else b.addEventListener("click", () => h === "listo" ? terminar() : h === "escoba" ? hojaNueva() : elegirHerramienta(h));
        $("botones").appendChild(b);
      });

    mostrarGaleria();
  </script>
</body>
</html>
