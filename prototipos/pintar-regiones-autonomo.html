:root {
  --bg: #fff7ec;
  --ink: #3b2a4a;
  --rojo: #ff5a5f;
  --azul: #3fa7ff;
  --amarillo: #ffd23f;
  --verde: #4cd17a;
  --morado: #a66bff;
  --naranja: #ff9f43;
  --rosa: #ff7eb6;
  --turquesa: #2bb5a0;
  --radius: 32px;
  --font: "Baloo 2", "Comic Sans MS", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overscroll-behavior: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

button { font: inherit; color: inherit; border: 0; cursor: pointer; }

/* Botón "casita" para volver al menú: grande y siempre en la misma esquina */
.btn-casa {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 50;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #fff;
  font-size: 40px;
  display: grid;
  place-items: center;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
  text-decoration: none;
  transition: transform .15s;
}
.btn-casa:active { transform: scale(.9); }
.btn-casa svg { width: 46px; height: 46px; }

.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop {
  0% { transform: scale(.6); }
  100% { transform: scale(1); }
}

.wiggle { animation: wiggle .5s ease-in-out; }
@keyframes wiggle {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-8deg); }
  75% { transform: rotate(8deg); }
}

.confeti {
  position: fixed;
  top: -20px;
  width: 14px;
  height: 14px;
  border-radius: 3px;
  pointer-events: none;
  z-index: 100;
  animation: caer linear forwards;
}
@keyframes caer {
  to { transform: translateY(110vh) rotate(720deg); }
}

@media (prefers-reduced-motion: reduce) {
  .pop, .wiggle, .confeti { animation: none; }
}

/* Chispitas de Juegos.pop(el) y premio de Juegos.premio() (animados con GSAP desde common.js) */
.chispa { position: fixed; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 100; }
.premio {
  position: fixed; left: 50%; top: 45%; z-index: 110; pointer-events: none;
  width: min(60vw, 280px); aspect-ratio: 1 / 1; margin: calc(min(60vw, 280px) / -2) 0 0 calc(min(60vw, 280px) / -2);
  background: #fff; border-radius: 50%; padding: 8%;
  box-shadow: 0 0 0 10px var(--amarillo), 0 18px 0 rgba(0, 0, 0, .15);
  animation: pop .5s cubic-bezier(.3, 1.6, .5, 1);
}
.premio svg { width: 100%; height: 100%; display: block; overflow: visible; }
.premio img { width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; }

/* Partes animables de los dibujos (assets/js/dibujos.js). El estado .sonando las activa */
.ojos, .cabeza, .oreja-i, .oreja-d { transform-box: fill-box; }
.ojos { transform-origin: center; animation: parpadeo 4.5s infinite; }
@keyframes parpadeo { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

.boca-abierta { display: none; }
.sonando .boca-abierta { display: inline; }
.sonando .boca { display: none; }
.sonando .cabeza { animation: hablar .35s ease-in-out infinite alternate; transform-origin: 50% 90%; }
@keyframes hablar { from { transform: rotate(-4deg) scale(1); } to { transform: rotate(4deg) scale(1.04); } }
.oreja-i { transform-origin: 80% 80%; }
.oreja-d { transform-origin: 20% 80%; }
.sonando .oreja-i { animation: oreja-i .3s ease-in-out infinite alternate; }
.sonando .oreja-d { animation: oreja-d .3s ease-in-out infinite alternate; }
@keyframes oreja-i { to { transform: rotate(-14deg); } }
@keyframes oreja-d { to { transform: rotate(14deg); } }

@media (prefers-reduced-motion: reduce) {
  .ojos, .sonando .cabeza, .sonando .oreja-i, .sonando .oreja-d { animation: none; }
}

    .editor { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 96px 12px 12px; }

    .lienzo.brilla #trazos { animation: titilar 1.6s ease-in-out infinite alternate; }
    @keyframes titilar { to { filter: brightness(1.12) saturate(1.15); } }
    .herramientas { display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(100%, 640px); }
    .fila { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .fila.desliza { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; width: 100%; padding: 6px 8px 10px; scroll-snap-type: x proximity; touch-action: pan-x; scrollbar-width: none; }
    .fila.desliza::-webkit-scrollbar { display: none; }
    .fila.desliza > * { flex: none; scroll-snap-align: start; }
    .color, .herr { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 4px 0 rgba(0, 0, 0, .15); transition: transform .12s; }
    .color.activo { transform: scale(1.22); outline: 4px solid #fff; outline-offset: -4px; }
    .color.blanco { box-shadow: inset 0 0 0 3px #e5ded4, 0 4px 0 rgba(0, 0, 0, .15); }
    .herr { background: #fff; display: grid; place-items: center; }
    .herr svg { width: 46px; height: 46px; }
    .herr.activo { background: var(--amarillo); transform: scale(1.12); }
    .herr.listo { background: #e9fbef; }
    .herr:active, .color:active { transform: scale(.9); }
    .grosor { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); }
    .grosor span { display: block; border-radius: 50%; background: var(--ink); }
    .grosor.activo { background: var(--amarillo); }
    .barrido { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #fff 30% 70%, transparent); z-index: 5; pointer-events: none; }
    .toast { position: fixed; left: 50%; top: 100px; transform: translateX(-50%); background: #fff; padding: 8px 16px; border-radius: 20px; box-shadow: 0 6px 0 rgba(0,0,0,.12); font-weight: 800; z-index: 90; }
    @media (orientation: landscape) and (min-width: 700px) {
      .editor { flex-direction: row; padding: 96px 16px 16px; gap: 20px; }
      .lienzo { width: min(calc(100dvh - 112px), calc(100vw - 360px)); }
      .herramientas { width: 300px; }
    }
    @media (prefers-reduced-motion: reduce) { .lienzo.brilla #trazos { animation: none; } }
  </style>
</head>

  <a class="btn-casa" href="../../" aria-label="Volver">🏠</a>
  <div class="aviso">PROTOTIPO · regiones</div>
  <section class="editor">
    <div class="lienzo balde" id="lienzo">
      <canvas id="relleno" width="1024" height="1024"></canvas>
      <canvas id="trazos" width="1024" height="1024"></canvas>
      <canvas id="lineas" width="1024" height="1024"></canvas>
    </div>
    <div class="herramientas">
      <div class="fila desliza" id="colores"></div>
      <div class="fila" id="grosores"></div>
      <div class="fila desliza" id="sellos" hidden></div>
      <div class="fila desliza" id="botones"></div>
    </div>
  </section>

  <script>// Utilidades compartidas por todos los juegos: voz, sonidos y confeti.

const Juegos = (() => {
  // Service worker para instalar la app y jugar sin internet. sw.js está en la raíz del sitio,
  // dos carpetas arriba de este script, así que su alcance cubre el menú y todos los juegos
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    const sw = new URL("sw.js", location.href);
    addEventListener("load", () => navigator.serviceWorker.register(sw).catch(() => {}));
  }

  let ctx;
  const audio = () => (ctx ??= new (window.AudioContext || window.webkitAudioContext)());

  // Voz en español (la niña aún no lee, así que todo se dice en voz alta)
  let vozEs;
  const cargarVoz = () => {
    const voces = speechSynthesis.getVoices();
    vozEs = voces.find(v => v.lang === "es-PE") ||
            voces.find(v => v.lang.startsWith("es-") && /female|mujer|paulina|monica|helena/i.test(v.name)) ||
            voces.find(v => v.lang.startsWith("es"));
  };
  if ("speechSynthesis" in window) {
    cargarVoz();
    speechSynthesis.onvoiceschanged = cargarVoz;
  }

  function decir(texto, { rate = 0.9, pitch = 1.2 } = {}) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = "es-ES";
    if (vozEs) u.voice = vozEs;
    u.rate = rate;
    u.pitch = pitch;
    speechSynthesis.speak(u);
  }

  function tono(freq = 440, dur = 0.15, tipo = "sine", vol = 0.25) {
    const a = audio();
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = tipo;
    o.frequency.setValueAtTime(freq, a.currentTime);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start();
    o.stop(a.currentTime + dur);
  }

  // Nota tipo xilófono: ataque corto y caída suave. Cada llamada es independiente (polifónico)
  function nota(freq, dur = 0.9) {
    const a = audio();
    if (a.state === "suspended") a.resume();
    const t = a.currentTime;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.3, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(a.destination);
    [[1, "triangle"], [4, "sine"]].forEach(([mult, tipo], i) => {
      const o = a.createOscillator();
      o.type = tipo;
      o.frequency.value = freq * mult;
      const v = a.createGain();
      v.gain.value = i ? 0.15 : 1; // armónico agudo suave: le da brillo de xilófono
      o.connect(v).connect(g);
      o.start(t);
      o.stop(t + dur);
    });
  }

  // Sonido de "pop"; si se le pasa un elemento, además estalla en chispitas de colores desde su centro
  function pop(el) {
    if (el) estallido(el);
    const a = audio();
    const o = a.createOscillator();
    const g = a.createGain();
    o.frequency.setValueAtTime(700, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(120, a.currentTime + 0.12);
    g.gain.setValueAtTime(0.35, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.15);
    o.connect(g).connect(a.destination);
    o.start();
    o.stop(a.currentTime + 0.15);
  }

  function fiesta() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tono(f, 0.2, "triangle"), i * 110));
    confeti();
  }

  const COLORES = ["#ff5a5f", "#3fa7ff", "#ffd23f", "#4cd17a", "#a66bff", "#ff9f43", "#ff7eb6"];

  // GSAP (assets/vendor/) da resortes y física más ricos; si no cargó, todo sigue con las animaciones CSS de base.css
  const G = () => window.gsap;
  const calma = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  function confeti(n = 40) {
    if (calma()) return;
    const g = G();
    for (let i = 0; i < n; i++) {
      const c = document.createElement("div");
      c.className = "confeti";
      c.style.background = COLORES[i % COLORES.length];
      if (i % 3 === 1) c.style.borderRadius = "50%";
      document.body.appendChild(c);
      if (!g) {
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = 1.5 + Math.random() * 1.5 + "s";
        c.style.animationDelay = Math.random() * 0.3 + "s";
        setTimeout(() => c.remove(), 3500);
        continue;
      }
      // Sale disparado desde abajo, sube y cae aleteando (giro en 3D) mientras se mece de lado a lado
      c.style.animation = "none";
      const r = g.utils.random, alto = innerHeight;
      g.set(c, { left: innerWidth / 2, top: alto * 0.85, scale: r(0.6, 1.3) });
      g.timeline({ onComplete: () => c.remove() })
        .to(c, { x: r(-innerWidth * 0.55, innerWidth * 0.55), y: -alto * r(0.45, 0.95), duration: r(0.6, 0.9), ease: "power2.out" })
        .to(c, { y: alto * 0.4, duration: r(1.6, 2.6), ease: "power1.in" })
        .to(c, { opacity: 0, duration: 0.4 }, "-=0.4");
      g.to(c, { rotation: r(-720, 720), rotationX: r(360, 1080), duration: 3, ease: "none" });
      g.to(c, { xPercent: r(-300, 300), duration: r(0.4, 0.8), ease: "sine.inOut", repeat: 5, yoyo: true, delay: 0.7 });
    }
  }

  function estallido(el) {
    const g = G();
    if (!g || calma()) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 12; i++) {
      const c = document.createElement("div");
      c.className = "chispa";
      c.style.background = COLORES[i % COLORES.length];
      document.body.appendChild(c);
      const ang = (i / 12) * Math.PI * 2, dist = g.utils.random(50, 110);
      g.set(c, { left: cx, top: cy, xPercent: -50, yPercent: -50 });
      g.to(c, { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist, scale: 0, duration: g.utils.random(0.45, 0.7),
                ease: "power3.out", onComplete: () => c.remove() });
    }
  }

  // Aplasta y estira un elemento (squash & stretch), como un juguete de goma
  function rebotar(el) {
    if (!el) return;
    const g = G();
    if (!g || calma()) return animar(el, "pop");
    g.timeline({ defaults: { transformOrigin: "50% 100%" } })
      .to(el, { scaleX: 1.18, scaleY: 0.82, duration: 0.09, ease: "power2.out" })
      .to(el, { scaleX: 0.9, scaleY: 1.12, duration: 0.12, ease: "power2.out" })
      .to(el, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "elastic.out(1.1, 0.35)" });
  }

  // Premio: el dibujo aparece grande en el centro con resorte y vuela a una esquina (o al elemento destino)
  function premio(html, destino) {
    const p = document.createElement("div");
    p.className = "premio";
    p.innerHTML = html;
    document.body.appendChild(p);
    fiesta();
    const g = G();
    if (!g || calma()) { setTimeout(() => p.remove(), 1400); return; }
    p.style.animation = "none";
    const d = destino?.getBoundingClientRect?.() || { left: innerWidth - 60, top: 20, width: 40, height: 40 };
    const r = p.getBoundingClientRect();
    g.timeline({ onComplete: () => p.remove() })
      .from(p, { scale: 0, rotation: -25, duration: 0.7, ease: "back.out(2.2)" })
      .to(p, { rotation: 8, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" })
      .to(p, { x: d.left + d.width / 2 - (r.left + r.width / 2), y: d.top + d.height / 2 - (r.top + r.height / 2),
               scale: 0.2, duration: 0.7, ease: "power2.in" })
      .add(() => destino && rebotar(destino));
  }

  // Transiciones entre el menú y los juegos: entra con un fundido y la casita sale con un rebote
  function irA(url) {
    const g = G();
    if (!g) return (location.href = url);
    g.to("body", { opacity: 0, scale: calma() ? 1 : 0.96, duration: 0.25, ease: "power1.in", onComplete: () => (location.href = url) });
  }
  addEventListener("pageshow", () => { // al volver con "atrás" la página viene de la caché: reponerla
    const g = G();
    if (!g) return;
    g.fromTo("body", { opacity: 0 }, { opacity: 1, duration: calma() ? 0.2 : 0.35, clearProps: "opacity,transform" });
    const casa = document.querySelector(".btn-casa");
    if (casa && !calma()) g.from(casa, { scale: 0, rotation: -90, duration: 0.6, delay: 0.15, ease: "back.out(2)", clearProps: "transform" });
  });
  document.addEventListener("click", e => {
    const casa = e.target.closest?.(".btn-casa");
    if (!casa || !G() || e.defaultPrevented) return; // un juego que la usa para otra cosa (Pintar: volver a la galería) ya la atendió
    e.preventDefault();
    rebotar(casa);
    irA(casa.href);
  });

  // Progreso por juego en una sola clave (maya.progreso). Sube de nivel con 5 aciertos seguidos o 80 % en las
  // últimas 10 rondas; tras 3 fallos seguidos baja uno en silencio. Si el almacenamiento falla, queda en memoria
  const progreso = (() => {
    const CLAVE = "maya.progreso";
    let todo;
    const cargarTodo = () => {
      if (todo) return todo;
      try { todo = JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch { todo = {}; }
      return todo;
    };
    const escribirTodo = () => { try { localStorage.setItem(CLAVE, JSON.stringify(todo)); } catch {} };
    const nuevo = () => ({ nivel: 1, max: 99, aciertos: 0, racha: 0, fallos: 0, ultimas: [], stickers: [] });

    function leer(juego) { return { ...nuevo(), ...cargarTodo()[juego] }; }
    function guardar(juego, datos) { cargarTodo()[juego] = { ...leer(juego), ...datos }; escribirTodo(); }
    // Cada juego declara al iniciar cuántos niveles tiene; devuelve el nivel guardado
    function configurar(juego, { maxNivel }) {
      const d = leer(juego);
      guardar(juego, { max: maxNivel, nivel: Math.min(d.nivel, maxNivel) });
      return leer(juego).nivel;
    }
    const cambiarNivel = (d, delta) => {
      d.nivel = Math.max(1, Math.min(d.max, d.nivel + delta));
      d.racha = 0; d.fallos = 0; d.ultimas = []; // cada nivel empieza de nuevo la cuenta
    };

    function acierto(juego) {
      const d = leer(juego), antes = d.nivel;
      d.aciertos++; d.racha++; d.fallos = 0;
      d.ultimas = [...d.ultimas, 1].slice(-10);
      const bien = d.ultimas.reduce((s, x) => s + x, 0);
      const completo = d.racha >= 5 || (d.ultimas.length === 10 && bien >= 8);
      if (completo) cambiarNivel(d, 1); // en el último nivel no sube, pero completarlo también se premia
      guardar(juego, d);
      const subio = d.nivel > antes;
      // Completar un nivel da un sticker del álbum (si el juego cargó stickers.js y aún quedan)
      const sticker = completo && typeof Stickers !== "undefined" ? Stickers.ganar(juego) : null;
      if (sticker) decir((subio ? "¡Subiste de nivel! " : "") + `¡Ganaste un sticker: ${sticker.nombre}!`);
      else if (subio) { fiesta(); decir("¡Subiste de nivel!"); }
      return { nivel: d.nivel, subio, bajo: false, sticker };
    }
    function fallo(juego) {
      const d = leer(juego), antes = d.nivel;
      d.racha = 0; d.fallos++;
      d.ultimas = [...d.ultimas, 0].slice(-10);
      if (d.fallos >= 3) cambiarNivel(d, -1); // sin aviso: para ella nunca hay "perder"
      guardar(juego, d);
      return { nivel: d.nivel, subio: false, bajo: d.nivel < antes };
    }
    function reiniciar(juego) {
      cargarTodo();
      if (juego) delete todo[juego]; else todo = {};
      escribirTodo();
    }
    const juegos = () => Object.keys(cargarTodo());
    return { leer, guardar, configurar, acierto, fallo, reiniciar, juegos };
  })();

  const azar = arr => arr[Math.floor(Math.random() * arr.length)];
  const mezclar = arr => [...arr].sort(() => Math.random() - 0.5);

  function animar(el, clase) {
    el.classList.remove(clase);
    void el.offsetWidth;
    el.classList.add(clase);
  }

  // Sonidos MP3 decodificados a AudioBuffer: menor latencia que <audio>, sobre todo en iOS
  const buffers = new Map();
  let fuenteActual, turno = 0;

  function cargar(url) {
    if (!buffers.has(url)) {
      buffers.set(url, fetch(url)
        .then(r => { if (!r.ok) throw new Error(url); return r.arrayBuffer(); })
        .then(datos => audio().decodeAudioData(datos))
        .catch(e => { buffers.delete(url); throw e; }));
    }
    return buffers.get(url);
  }

  function callar() {
    turno++;
    if (fuenteActual) { fuenteActual.onended = null; try { fuenteActual.stop(); } catch {} fuenteActual = null; }
  }

  // Reproduce un MP3 cortando el anterior; la promesa se resuelve al terminar (o rechaza si falla)
  // Si se corta por otro sonido, la promesa queda pendiente (no dispara lo que venía después)
  async function sonar(url) {
    callar();
    const mio = turno;
    const a = audio();
    if (a.state === "suspended") a.resume();
    const buffer = await cargar(url);
    if (mio !== turno) return new Promise(() => {});
    return new Promise(resolve => {
      const f = a.createBufferSource();
      f.buffer = buffer;
      f.connect(a.destination);
      f.onended = () => { if (fuenteActual === f) fuenteActual = null; resolve(); };
      fuenteActual = f;
      f.start();
    });
  }

    const NOMBRES_HERR = { balde: "¡A rellenar!", pincel: "¡Pincel!", estrellas: "¡Estrellitas!", goma: "¡Goma! Toca o frota para despintar", arcoiris: "¡Pincel arcoíris!", brillitos: "¡Brillitos!", magico: "¡Pincel mágico! No se sale de las líneas", sellos: "¡Sellos! Toca para pegar" };
    function elegirHerramienta(h, silencio) {
      herramienta = h; lienzo.classList.toggle("balde", h === "balde");
      document.querySelectorAll("[data-herr]").forEach(b => b.classList.toggle("activo", b.dataset.herr === h));
      $("grosores").hidden = !["pincel", "goma", "arcoiris", "brillitos", "magico"].includes(h); $("sellos").hidden = h !== "sellos";
      if (!silencio) Juegos.decir(NOMBRES_HERR[h]);
    }
    COLORES.forEach(([c, nombre], i) => {
      const b = document.createElement("button"); b.className = "color" + (i === 0 ? " activo" : "") + (c === "#ffffff" ? " blanco" : "");
      b.style.background = c; b.setAttribute("aria-label", nombre);
      b.addEventListener("click", () => { color = c; document.querySelectorAll(".color").forEach(x => x.classList.toggle("activo", x === b));
        if (["goma", "estrellas", "sellos", "arcoiris"].includes(herramienta)) elegirHerramienta("balde", true); Juegos.decir(nombre); });
      $("colores").appendChild(b);
    });
    GROSORES.forEach((g, i) => {
      const b = document.createElement("button"); b.className = "grosor" + (i === 1 ? " activo" : ""); b.setAttribute("aria-label", ["delgado", "mediano", "grueso"][i]);
      b.innerHTML = `<span style="width:${8 + i * 8}px;height:${8 + i * 8}px"></span>`;
      b.addEventListener("click", () => { grosor = g; document.querySelectorAll(".grosor").forEach(x => x.classList.toggle("activo", x === b)); });
      $("grosores").appendChild(b);
    });
    Object.entries(SELLOS).forEach(([id, s]) => {
      const b = document.createElement("button"); b.className = "herr"; b.dataset.sello = id; b.setAttribute("aria-label", s.nombre); b.innerHTML = s.svg;
      b.addEventListener("click", () => { sello = id; Juegos.decir(s.nombre); document.querySelectorAll("[data-sello]").forEach(x => x.classList.toggle("activo", x === b)); });
      $("sellos").appendChild(b);
    });
    document.querySelector("[data-sello]").classList.add("activo");
    [["balde", "rellenar"], ["pincel", "pincel"], ["magico", "pincel mágico"], ["arcoiris", "pincel arcoíris"], ["brillitos", "brillitos"], ["sellos", "sellos"],
     ["estrellas", "estrellitas"], ["goma", "goma"], ["deshacer", "deshacer"], ["escoba", "hoja nueva"], ["listo", "terminar"]].forEach(([h, etiqueta]) => {
      const b = document.createElement("button"); b.className = "herr" + (h === "listo" ? " listo" : ""); b.dataset.herr = h; b.setAttribute("aria-label", etiqueta); b.innerHTML = ICONOS[h];
      if (h === "deshacer") {
        let rep; b.addEventListener("pointerdown", () => { deshacer(); rep = setTimeout(function otra() { deshacer(); rep = setTimeout(otra, 280); }, 600); });
        ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => clearTimeout(rep)));
      } else b.addEventListener("click", () => h === "listo" ? terminar() : h === "escoba" ? hojaNueva() : elegirHerramienta(h));
      $("botones").appendChild(b);
    });
    addEventListener("pagehide", guardar);

    // ---------- Arranque ----------
    function aviso(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
    (async () => {
      await analizar(LAMINA.url);
      let nuevo = null, viejo = null;
      try { nuevo = JSON.parse(localStorage.getItem(CLAVE)); } catch {}
      try { viejo = JSON.parse(localStorage.getItem(CLAVE_VIEJA)); } catch {}
      if (nuevo) {
        aplicarGuardado(nuevo);
        if (nuevo.trazo) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, N, N); im.src = nuevo.trazo; }
        lienzo.classList.toggle("brilla", !!nuevo.brillo);
      } else if (viejo?.rellenos && Object.keys(viejo.rellenos).length) {
        const n = migrarViejo(viejo); M.migrados = n; aviso(`Traje ${n} colores de tu dibujo anterior`);
        if (viejo.trazo) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, N, N); im.src = viejo.trazo; }   // el trazo era a 800: se estira a 1024
      }
      repintarTodo(); elegirHerramienta("balde", true);
      M.listo = true; M.regiones = { total: R.n, utiles: R.utiles, motitas: R.chicas, firma: R.firma };
      Juegos.decir(`Pinta ${LAMINA.nombre}`);
    })();
  </script>
</body>
</html>
