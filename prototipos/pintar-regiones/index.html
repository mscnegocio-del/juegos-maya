<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#fff7ec">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Prototipo: Pintar por regiones</title>
  <link rel="stylesheet" href="../../assets/css/base.css">
  <style>
    /* PROTOTIPO (spike): editor de Pintar con láminas en imagen y regiones detectadas automáticamente. No lo carga el sitio ni sw.js */
    [hidden] { display: none !important; }
    html, body { height: 100%; overflow: hidden; touch-action: none; }
    body { background: linear-gradient(#efe4ff, #fff7ec); }
    .aviso { position: fixed; top: 10px; right: 10px; background: var(--ink); color: #fff; font: 700 13px var(--font); padding: 6px 10px; border-radius: 12px; opacity: .8; z-index: 80; }
    .editor { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 96px 12px 12px; }
    .lienzo { position: relative; flex: none; width: min(calc(100vw - 24px), calc(100dvh - 380px)); aspect-ratio: 1 / 1; background: #fff;
              border-radius: 24px; box-shadow: 0 8px 0 rgba(0, 0, 0, .1); overflow: hidden; touch-action: none; }
    .lienzo canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #lineas { pointer-events: none; }
    .lienzo.balde #trazos { pointer-events: none; }  /* con el balde el toque llega a la capa de regiones */
    .lienzo.brilla #trazos { animation: titilar 1.6s ease-in-out infinite alternate; }
    @keyframes titilar { to { filter: brightness(1.12) saturate(1.15); } }
    .herramientas { display: flex; flex-direction: column; gap: 10px; align-items: center; width: min(100%, 640px); }
    .fila { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .fila.desliza { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; width: 100%; padding: 6px 8px 10px; scroll-snap-type: x proximity; touch-action: pan-x; scrollbar-width: none; }
    .fila.desliza::-webkit-scrollbar { display: none; }
    .fila.desliza > * { flex: none; scroll-snap-align: start; }
    .color, .herr { width: 72px; height: 72px; border-radius: 50%; box-shadow: 0 4px 0 rgba(0, 0, 0, .15); transition: transform .12s; }
    .color.activo { transform: scale(1.22); outline: 4px solid #fff; outline-offset: -4px; }
    .color.blanco { box-shadow: inset 0 0 0 3px #e5ded4, 0 4px 0 rgba(0, 0, 0, .15); }
    .herr { background: #fff; display: grid; place-items: center; }
    .herr svg { width: 46px; height: 46px; }
    .herr.activo { background: var(--amarillo); transform: scale(1.12); }
    .herr.listo { background: #e9fbef; }
    .herr:active, .color:active { transform: scale(.9); }
    .grosor { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 4px 0 rgba(0, 0, 0, .12); }
    .grosor span { display: block; border-radius: 50%; background: var(--ink); }
    .grosor.activo { background: var(--amarillo); }
    .barrido { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #fff 30% 70%, transparent); z-index: 5; pointer-events: none; }
    .toast { position: fixed; left: 50%; top: 100px; transform: translateX(-50%); background: #fff; padding: 8px 16px; border-radius: 20px; box-shadow: 0 6px 0 rgba(0,0,0,.12); font-weight: 800; z-index: 90; }
    @media (orientation: landscape) and (min-width: 700px) {
      .editor { flex-direction: row; padding: 96px 16px 16px; gap: 20px; }
      .lienzo { width: min(calc(100dvh - 112px), calc(100vw - 360px)); }
      .herramientas { width: 300px; }
    }
    @media (prefers-reduced-motion: reduce) { .lienzo.brilla #trazos { animation: none; } }
  </style>
</head>
<body>
  <a class="btn-casa" href="../../" aria-label="Volver">🏠</a>
  <div class="aviso">PROTOTIPO · regiones</div>
  <section class="editor">
    <div class="lienzo balde" id="lienzo">
      <canvas id="relleno" width="1024" height="1024"></canvas>
      <canvas id="trazos" width="1024" height="1024"></canvas>
      <canvas id="lineas" width="1024" height="1024"></canvas>
    </div>
    <div class="herramientas">
      <div class="fila desliza" id="colores"></div>
      <div class="fila" id="grosores"></div>
      <div class="fila desliza" id="sellos" hidden></div>
      <div class="fila desliza" id="botones"></div>
    </div>
  </section>

  <script src="../../assets/vendor/gsap/gsap.min.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="../../assets/js/dibujos.js"></script>
  <script src="../../assets/js/colorear.js"></script>
  <script>
    const N = 1024, SC = N / 800;                    // el editor actual trabaja a 800; aquí 1024 (todo escalado por SC)
    const { ICONOS, SELLOS } = Colorear;
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const LAMINA = { id: "tortuga", url: params.get("img") || "laminas/tortuga.png", nombre: "la tortuga" };
    const CLAVE = `maya.colorear2.${LAMINA.id}`, CLAVE_VIEJA = `maya.colorear.${LAMINA.id}`;
    const M = window.__m = { relleno_ms: [], mascara_ms: [], deshacer_ms: [], mover_ms: [] };   // métricas para las pruebas

    // =====================================================================
    // 1. Detección de regiones. Una región = área blanca cerrada por líneas (4-vecinos), numerada en orden de lectura.
    //    Misma imagen => mismos números siempre (el recorrido es determinista).
    // =====================================================================
    const R = { n: 0, area: [0], bb: [null], sx: [0], sy: [0], seed: [null], fl: null, label: null, firma: "" };
    const MIN_AREA = 60;                            // regiones más chicas (motitas) no se pueden pintar: quedan como parte del dibujo

    async function analizar(url) {
      const t0 = performance.now();
      const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url; });
      const c = document.createElement("canvas"); c.width = c.height = N;
      const x = c.getContext("2d", { willReadFrequently: true });
      x.fillStyle = "#fff"; x.fillRect(0, 0, N, N); x.drawImage(img, 0, 0, N, N);   // las transparencias cuentan como blanco
      const d = x.getImageData(0, 0, N, N).data, tot = N * N;

      // Capa de contornos: el gris se vuelve transparencia (negro con alpha), así se superpone sobre cualquier color y sirve con fondo blanco o transparente
      // Autonivel: el trazo más oscuro de la imagen cuenta como negro pleno (así un contorno morado oscuro o gris no queda semitransparente)
      let minLum = 255; for (let j = 0; j < d.length; j += 4) { const l = (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000; if (l < minLum) minLum = l; }
      const escala = minLum < 200 ? 255 / (255 - minLum) : 1;
      const linea = new Uint8Array(tot), lc = $("lineas"), lx = lc.getContext("2d"), ld = lx.createImageData(N, N), L = ld.data;
      for (let i = 0, j = 0; i < tot; i++, j += 4) {
        const a = Math.min(255, (255 - (d[j] * 299 + d[j + 1] * 587 + d[j + 2] * 114) / 1000) * escala);
        L[j + 3] = a < 12 ? 0 : a; linea[i] = a >= 128 ? 1 : 0;
      }
      lx.putImageData(ld, 0, 0);

      // Cierre de huecos: el contorno se engrosa CIERRE px solo para decidir regiones, así un hueco de hasta 2×CIERRE px en la línea ya no deja escapar el color.
      // (Se compensa más abajo ampliando cada región hasta el borde real de la línea)
      const CIERRE = params.has("cierre") ? +params.get("cierre") : 3;
      let gruesa = linea;
      for (let k = 0; k < CIERRE; k++) {
        const prev = gruesa, nueva = prev.slice();
        for (let p = 0; p < tot; p++) { if (prev[p]) continue; const px = p % N; if ((px > 0 && prev[p - 1]) || (px < N - 1 && prev[p + 1]) || (p >= N && prev[p - N]) || (p < tot - N && prev[p + N])) nueva[p] = 1; }
        gruesa = nueva;
      }
      // Etiquetado por relleno (pila explícita, sin recursión)
      const label = new Uint16Array(tot), pila = new Int32Array(tot);
      let n = 0; const area = [0], bb = [null], sx = [0], sy = [0];
      for (let s = 0; s < tot; s++) {
        if (gruesa[s] || label[s]) continue;
        n++; let sp = 0; pila[sp++] = s; label[s] = n;
        let a = 0, x0 = N, y0 = N, x1 = 0, y1 = 0, ax = 0, ay = 0;
        while (sp) {
          const p = pila[--sp], px = p % N, py = (p / N) | 0;
          a++; ax += px; ay += py; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
          let q;
          if (px > 0 && !gruesa[q = p - 1] && !label[q]) { label[q] = n; pila[sp++] = q; }
          if (px < N - 1 && !gruesa[q = p + 1] && !label[q]) { label[q] = n; pila[sp++] = q; }
          if (py > 0 && !gruesa[q = p - N] && !label[q]) { label[q] = n; pila[sp++] = q; }
          if (py < N - 1 && !gruesa[q = p + N] && !label[q]) { label[q] = n; pila[sp++] = q; }
        }
        area.push(a); bb.push([x0, y0, x1, y1]); sx.push(ax / a); sy.push(ay / a);
      }
      // Motitas: se descartan (su número queda sin usar, así los demás no cambian)
      let chicas = 0;
      for (let id = 1; id <= n; id++) if (area[id] < MIN_AREA) {
        chicas++; const [x0, y0, x1, y1] = bb[id];
        for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) if (label[yy * N + xx] === id) label[yy * N + xx] = 0;
        area[id] = 0;
      }
      // Relleno ampliado: el color se mete hasta el borde real de la línea (y 3 px bajo ella) para que no quede un halo blanco entre color y contorno
      let fl = label.slice();
      for (let k = 0; k < CIERRE + 3; k++) {
        const prev = fl.slice();
        for (let p = 0; p < tot; p++) {
          if (prev[p]) continue; const px = p % N;
          let v = px > 0 ? prev[p - 1] : 0; if (!v && px < N - 1) v = prev[p + 1]; if (!v && p >= N) v = prev[p - N]; if (!v && p < tot - N) v = prev[p + N];
          if (v) fl[p] = v;
        }
      }
      // Punto semilla de cada región: el píxel de la región más cercano a su centro (sirve para reconocerla aunque cambien los números)
      const bd = new Float64Array(n + 1).fill(1e18), bx = new Int16Array(n + 1), by = new Int16Array(n + 1);
      for (let p = 0; p < tot; p++) {
        const id = label[p]; if (!id) continue;
        const px = p % N, py = (p / N) | 0, dx = px - sx[id], dy = py - sy[id], dd = dx * dx + dy * dy;
        if (dd < bd[id]) { bd[id] = dd; bx[id] = px; by[id] = py; }
      }
      const seed = [null]; for (let id = 1; id <= n; id++) seed.push([bx[id], by[id]]);
      let utiles = 0, suma = 0; for (let id = 1; id <= n; id++) if (area[id]) { utiles++; suma += area[id]; }
      Object.assign(R, { n, area, bb, sx, sy, seed, fl, label, utiles, chicas, firma: `${utiles}:${suma}` });
      M.analisis_ms = Math.round(performance.now() - t0);
      return R;
    }

    // Región bajo un punto; si el dedo cayó sobre la línea gruesa, se toma la más cercana (dedos de 3 años no son precisos)
    function regionEn(x, y) {
      x |= 0; y |= 0;
      for (let rad = 0; rad <= 24; rad += 4) for (let a = 0; a < (rad ? 8 : 1); a++) {
        const px = Math.round(x + Math.cos(a * Math.PI / 4) * rad), py = Math.round(y + Math.sin(a * Math.PI / 4) * rad);
        if (px < 0 || py < 0 || px >= N || py >= N) continue;
        const id = R.fl[py * N + px]; if (id && R.area[id]) return id;
      }
      return 0;
    }

    // =====================================================================
    // 2. Capa de color por regiones (rellenar / borrar una región toca solo su caja de píxeles)
    // =====================================================================
    const cr = $("relleno"), crx = cr.getContext("2d", { willReadFrequently: true });
    const fillData = crx.createImageData(N, N);
    let rellenos = new Map();                       // id de región -> color
    const rgb = hex => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    function pintarRegion(id, color) {
      const t0 = performance.now();
      const [x0, y0, x1, y1] = R.bb[id], bx0 = Math.max(0, x0 - 8), by0 = Math.max(0, y0 - 8), bx1 = Math.min(N - 1, x1 + 8), by1 = Math.min(N - 1, y1 + 8);
      const [r, g, b] = color ? rgb(color) : [0, 0, 0], a = color ? 255 : 0, D = fillData.data, fl = R.fl;
      for (let y = by0; y <= by1; y++) for (let x = bx0, p = y * N + bx0; x <= bx1; x++, p++) if (fl[p] === id) { const j = p * 4; D[j] = r; D[j + 1] = g; D[j + 2] = b; D[j + 3] = a; }
      crx.putImageData(fillData, 0, 0, bx0, by0, bx1 - bx0 + 1, by1 - by0 + 1);
      M.relleno_ms.push(+(performance.now() - t0).toFixed(2));
    }
    function colorear(id, color, registrar = true) {   // color null = borrar
      const antes = rellenos.get(id);
      if ((antes || null) === (color || null)) return false;
      if (registrar) recordar({ tipo: "region", id, antes });
      color ? rellenos.set(id, color) : rellenos.delete(id);
      pintarRegion(id, color);
      return true;
    }
    function repintarTodo() {
      fillData.data.fill(0); crx.clearRect(0, 0, N, N);
      for (const [id, c] of rellenos) pintarRegion(id, c);
    }

    // =====================================================================
    // 3. Guardado: v2 guarda por cada región su número Y su punto semilla; si cambia la imagen, se reconoce por el punto
    // =====================================================================
    const canvas = $("trazos"), ctx = canvas.getContext("2d", { willReadFrequently: true }), lienzo = $("lienzo");
    ctx.lineCap = ctx.lineJoin = "round";
    const hayTrazo = () => ctx.getImageData(0, 0, N, N).data.some((v, i) => i % 4 === 3 && v);
    function guardar() {
      const t0 = performance.now();
      const r = [...rellenos].map(([id, c]) => [id, ...R.seed[id], c]);
      const trazo = hayTrazo() ? canvas.toDataURL("image/webp", .85) : null;
      try { localStorage.setItem(CLAVE, JSON.stringify({ v: 2, firma: R.firma, rellenos: r, trazo, brillo: lienzo.classList.contains("brilla") })); } catch (e) { M.error_guardado = String(e); }
      M.guardar_ms = Math.round(performance.now() - t0); M.guardado_kb = Math.round((localStorage.getItem(CLAVE) || "").length / 1024);
    }
    // Carga: si la firma coincide se usan los números; si no (la imagen cambió), cada color se busca por su punto semilla
    function aplicarGuardado(g) {
      const mismo = g.firma === R.firma; let ok = 0, perdidos = 0;
      for (const [id, sx, sy, c] of g.rellenos) {
        const destino = mismo ? id : (R.fl[sy * N + sx] && R.area[R.fl[sy * N + sx]] ? R.fl[sy * N + sx] : 0);
        if (destino) { rellenos.set(destino, c); ok++; } else perdidos++;
      }
      M.carga = { mismaImagen: mismo, aplicados: ok, perdidos };
    }
    // Migración desde el guardado viejo (zonas SVG numeradas 0..n). Cada REGIÓN nueva pregunta qué zona vieja (la de más arriba) cubre una muestra de sus
    // píxeles y hereda su color por mayoría; así una zona vieja partida en varias regiones nuevas se pinta entera.
    // Solo funciona si la lámina nueva calca la geometría de la vieja (misma viewBox 200×200): con otra ilustración no hay correspondencia posible.
    function migrarViejo(viejo) {
      const d = Colorear.DIBUJOS.find(z => z.id === LAMINA.id); if (!d) return 0;
      const NS = "http://www.w3.org/2000/svg", s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 200 200");
      s.setAttribute("width", 200); s.setAttribute("height", 200); s.style.cssText = "position:absolute;left:-9999px";
      s.innerHTML = d.zonas.map(z => `<${z}/>`).join(""); document.body.appendChild(s);
      const els = [...s.children], pt = s.createSVGPoint(), muestras = {};
      for (let p = 0; p < N * N; p += 211) { const id = R.label[p]; if (id) (muestras[id] ||= []).length < 15 && muestras[id].push(p); }
      let migrados = 0;
      for (const id of Object.keys(muestras)) {
        const votos = {};
        for (const p of muestras[id]) {
          pt.x = (p % N) * 200 / N; pt.y = ((p / N) | 0) * 200 / N; let z = -1;
          for (let i = els.length - 1; i >= 0; i--) if (els[i].isPointInFill(pt)) { z = i; break; }
          votos[z] = (votos[z] || 0) + 1;
        }
        const [z] = Object.entries(votos).sort((a, b) => b[1] - a[1])[0];
        if (+z >= 0 && viejo.rellenos?.[z]) { rellenos.set(+id, viejo.rellenos[z]); migrados++; }
      }
      s.remove(); return migrados;
    }

    // =====================================================================
    // 4. Herramientas (igual que el editor actual; el canvas de pincel pasa a 1024)
    // =====================================================================
    const COLORES = [["#ff5a5f", "rojo"], ["#ff9f43", "naranja"], ["#ffd23f", "amarillo"], ["#4cd17a", "verde"], ["#3fa7ff", "azul"], ["#a66bff", "morado"], ["#ff7eb6", "rosado"],
      ["#9fdcff", "celeste"], ["#ffc8dc", "rosado clarito"], ["#a0673f", "café"], ["#f5c9a0", "color piel"], ["#a9a7b4", "gris"], ["#3b2a4a", "negro"], ["#ffffff", "blanco"]];
    const GROSORES = [14 * SC, 28 * SC, 50 * SC];
    const conXmlns = s => s.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
    SELLOS.pato = { nombre: "el pato", svg: conXmlns(Dibujos.ANIMALES.pato) }; SELLOS.michi = { nombre: "Michi", svg: conXmlns(Dibujos.ANIMALES.gato) };
    Object.values(SELLOS).forEach(s => { s.img = new Image(); s.img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s.svg); });
    let color = COLORES[0][0], herramienta = "balde", grosor = GROSORES[1], sello = "estrella", tono = 0, mascara = null, historial = [];
    const MAX_HIST = 12;                            // cada paso de canvas pesa 4 MB (1024×1024×4): se limita para no ahogar celulares viejos
    const recordar = p => { historial.push(p); if (historial.length > MAX_HIST) historial.shift(); };
    const snap = () => ctx.getImageData(0, 0, N, N);

    const punto = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * N / r.width, (e.clientY - r.top) * N / r.height]; };
    const trazos = new Map();

    // Balde: la capa de regiones recibe el toque
    cr.addEventListener("pointerdown", e => {
      if (herramienta !== "balde") return;
      const [x, y] = punto(e), id = regionEn(x, y);
      if (!id) return;
      if (colorear(id, color)) Juegos.tono(500 + Math.random() * 300, .12, "sine", .2);
    });

    function estrellita(x, y) {
      const r = (18 + Math.random() * 22) * SC, giro = Math.random() * Math.PI;
      ctx.save(); ctx.globalCompositeOperation = "source-over"; ctx.beginPath();
      for (let k = 0; k < 10; k++) { const a = giro + k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      ctx.closePath(); ctx.fillStyle = Juegos.azar(COLORES.slice(0, 7))[0]; ctx.strokeStyle = "#3b2a4a"; ctx.lineWidth = 5 * SC; ctx.fill(); ctx.stroke(); ctx.restore();
    }
    function pegarSello(x, y) {
      const s = SELLOS[sello], tam = 150 * SC;
      ctx.save(); ctx.globalCompositeOperation = "source-over"; ctx.translate(x, y); ctx.rotate((Math.random() - .5) * .5);
      ctx.drawImage(s.img, -tam / 2, -tam / 2, tam, tam); ctx.restore(); Juegos.pop();
    }
    function brillos(x0, y0, x1, y1) {
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = .65; ctx.strokeStyle = color; ctx.lineWidth = grosor;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.globalAlpha = 1;
      for (let k = 0; k < 4; k++) {
        const px = x1 + (Math.random() - .5) * grosor * 1.4, py = y1 + (Math.random() - .5) * grosor * 1.4, r = (6 + Math.random() * 10) * SC;
        ctx.fillStyle = Juegos.azar(["#fff", "#fff8c4", "#ffd23f", "#ffc8dc", "#c8f0ff"]); ctx.beginPath();
        for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .35 : r; ctx.lineTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr); }
        ctx.fill();
      }
      lienzo.classList.add("brilla");
    }
    // Pincel mágico: el molde es la región donde empezó el trazo (más sencillo que antes: las regiones ya no se superponen)
    const capa = document.createElement("canvas"); capa.width = capa.height = N;
    const cc = capa.getContext("2d"); cc.lineCap = cc.lineJoin = "round";
    function mascaraRegion(id) {
      const t0 = performance.now();
      const [x0, y0, x1, y1] = R.bb[id], bx0 = Math.max(0, x0 - 8), by0 = Math.max(0, y0 - 8), bx1 = Math.min(N - 1, x1 + 8), by1 = Math.min(N - 1, y1 + 8);
      const w = bx1 - bx0 + 1, h = by1 - by0 + 1, im = new ImageData(w, h), D = im.data, fl = R.fl;
      for (let y = 0; y < h; y++) for (let x = 0, p = (by0 + y) * N + bx0; x < w; x++, p++) if (fl[p] === id) D[(y * w + x) * 4 + 3] = 255;
      const m = document.createElement("canvas"); m.width = m.height = N; m.getContext("2d").putImageData(im, bx0, by0);
      M.mascara_ms.push(+(performance.now() - t0).toFixed(2)); return m;
    }
    function trazoMagico(x0, y0, x1, y1) {
      cc.globalCompositeOperation = "source-over"; cc.clearRect(0, 0, N, N);
      cc.strokeStyle = color; cc.lineWidth = grosor; cc.beginPath(); cc.moveTo(x0, y0); cc.lineTo(x1, y1); cc.stroke();
      cc.globalCompositeOperation = "destination-in"; cc.drawImage(mascara, 0, 0);
      ctx.globalCompositeOperation = "source-over"; ctx.drawImage(capa, 0, 0);
    }

    canvas.addEventListener("pointerdown", e => {
      if (herramienta === "balde") return;
      canvas.setPointerCapture(e.pointerId);
      if (!trazos.size) recordar({ tipo: "canvas", imagen: snap() });
      const [x, y] = punto(e); trazos.set(e.pointerId, { x, y, n: 0, movio: false });
      if (herramienta === "estrellas") { estrellita(x, y); Juegos.tono(800 + Math.random() * 600, .1); }
      if (herramienta === "sellos") pegarSello(x, y);
      if (herramienta === "magico") { const id = regionEn(x, y); mascara = id ? mascaraRegion(id) : null; }
    });
    canvas.addEventListener("pointermove", e => {
      const t = trazos.get(e.pointerId); if (!t) return;
      const t0 = performance.now(), [x, y] = punto(e); t.movio = true;
      if (herramienta === "sellos") { /* uno por toque */ }
      else if (herramienta === "estrellas") { if (++t.n % 5 === 0) estrellita(x, y); }
      else if (herramienta === "brillitos") brillos(t.x, t.y, x, y);
      else if (herramienta === "magico") { if (mascara) trazoMagico(t.x, t.y, x, y); }
      else if (herramienta === "arcoiris") { tono = (tono + 14) % 360; ctx.globalCompositeOperation = "source-over"; ctx.strokeStyle = `hsl(${tono} 90% 60%)`; ctx.lineWidth = grosor; ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(x, y); ctx.stroke(); }
      else { ctx.globalCompositeOperation = herramienta === "goma" ? "destination-out" : "source-over"; ctx.strokeStyle = color; ctx.lineWidth = herramienta === "goma" ? grosor * 1.6 : grosor; ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(x, y); ctx.stroke(); }
      t.x = x; t.y = y; M.mover_ms.push(+(performance.now() - t0).toFixed(2));
    });
    function soltar(e) {
      const t = trazos.get(e.pointerId); if (!t) return;
      trazos.delete(e.pointerId); mascara = null;
      if (!t.movio && herramienta === "magico") {            // un toque del mágico pinta un punto recortado por la región
        const id = regionEn(t.x, t.y);
        if (id) { const m = mascaraRegion(id); cc.globalCompositeOperation = "source-over"; cc.clearRect(0, 0, N, N); cc.fillStyle = color; cc.beginPath(); cc.arc(t.x, t.y, grosor / 2, 0, Math.PI * 2); cc.fill();
                  cc.globalCompositeOperation = "destination-in"; cc.drawImage(m, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.drawImage(capa, 0, 0); }
      } else if (!t.movio && ["pincel", "arcoiris"].includes(herramienta)) {   // un toque sin mover deja un punto
        ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(t.x, t.y, grosor / 2, 0, Math.PI * 2); ctx.fill();
      }
      if (!t.movio && herramienta === "goma") { const id = regionEn(t.x, t.y); if (id && colorear(id, null)) Juegos.tono(300, .1); }  // un toque con la goma despinta la región
    }
    ["pointerup", "pointercancel"].forEach(ev => canvas.addEventListener(ev, soltar));

    function deshacer() {
      const t0 = performance.now(), p = historial.pop();
      if (!p) { Juegos.animar(document.querySelector('[data-herr="deshacer"]'), "wiggle"); return false; }
      if (p.tipo === "region") colorear(p.id, p.antes || null, false);
      else if (p.tipo === "todo") { rellenos = new Map(p.rellenos); repintarTodo(); ctx.putImageData(p.imagen, 0, 0); }
      else ctx.putImageData(p.imagen, 0, 0);
      Juegos.tono(300, .15, "triangle", .15); M.deshacer_ms.push(+(performance.now() - t0).toFixed(2)); return true;
    }
    function hojaNueva() {
      if (!rellenos.size && !hayTrazo()) return Juegos.decir("¡La hoja ya está en blanco!");
      guardar(); recordar({ tipo: "todo", rellenos: new Map(rellenos), imagen: snap() });
      const limpiar = () => { rellenos = new Map(); repintarTodo(); ctx.clearRect(0, 0, N, N); lienzo.classList.remove("brilla"); guardar(); };
      Juegos.decir("¡Hoja nueva!");
      if (window.gsap && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const b = document.createElement("div"); b.className = "barrido"; lienzo.appendChild(b);
        gsap.fromTo(b, { xPercent: -100 }, { xPercent: 100, duration: .7, ease: "power1.inOut", onComplete: () => b.remove() }); setTimeout(limpiar, 350);
      } else limpiar();
    }
    function terminar() {
      guardar(); Juegos.fiesta(); Juegos.decir("¡Qué bonito, Maya!");
      if (window.gsap && !matchMedia("(prefers-reduced-motion: reduce)").matches) gsap.to([cr, canvas, $("lineas")], { y: "-=30", duration: .3, yoyo: true, repeat: 5, ease: "power2.out" });
    }

    // ---------- Barra de herramientas ----------
    const NOMBRES_HERR = { balde: "¡A rellenar!", pincel: "¡Pincel!", estrellas: "¡Estrellitas!", goma: "¡Goma! Toca o frota para despintar", arcoiris: "¡Pincel arcoíris!", brillitos: "¡Brillitos!", magico: "¡Pincel mágico! No se sale de las líneas", sellos: "¡Sellos! Toca para pegar" };
    function elegirHerramienta(h, silencio) {
      herramienta = h; lienzo.classList.toggle("balde", h === "balde");
      document.querySelectorAll("[data-herr]").forEach(b => b.classList.toggle("activo", b.dataset.herr === h));
      $("grosores").hidden = !["pincel", "goma", "arcoiris", "brillitos", "magico"].includes(h); $("sellos").hidden = h !== "sellos";
      if (!silencio) Juegos.decir(NOMBRES_HERR[h]);
    }
    COLORES.forEach(([c, nombre], i) => {
      const b = document.createElement("button"); b.className = "color" + (i === 0 ? " activo" : "") + (c === "#ffffff" ? " blanco" : "");
      b.style.background = c; b.setAttribute("aria-label", nombre);
      b.addEventListener("click", () => { color = c; document.querySelectorAll(".color").forEach(x => x.classList.toggle("activo", x === b));
        if (["goma", "estrellas", "sellos", "arcoiris"].includes(herramienta)) elegirHerramienta("balde", true); Juegos.decir(nombre); });
      $("colores").appendChild(b);
    });
    GROSORES.forEach((g, i) => {
      const b = document.createElement("button"); b.className = "grosor" + (i === 1 ? " activo" : ""); b.setAttribute("aria-label", ["delgado", "mediano", "grueso"][i]);
      b.innerHTML = `<span style="width:${8 + i * 8}px;height:${8 + i * 8}px"></span>`;
      b.addEventListener("click", () => { grosor = g; document.querySelectorAll(".grosor").forEach(x => x.classList.toggle("activo", x === b)); });
      $("grosores").appendChild(b);
    });
    Object.entries(SELLOS).forEach(([id, s]) => {
      const b = document.createElement("button"); b.className = "herr"; b.dataset.sello = id; b.setAttribute("aria-label", s.nombre); b.innerHTML = s.svg;
      b.addEventListener("click", () => { sello = id; Juegos.decir(s.nombre); document.querySelectorAll("[data-sello]").forEach(x => x.classList.toggle("activo", x === b)); });
      $("sellos").appendChild(b);
    });
    document.querySelector("[data-sello]").classList.add("activo");
    [["balde", "rellenar"], ["pincel", "pincel"], ["magico", "pincel mágico"], ["arcoiris", "pincel arcoíris"], ["brillitos", "brillitos"], ["sellos", "sellos"],
     ["estrellas", "estrellitas"], ["goma", "goma"], ["deshacer", "deshacer"], ["escoba", "hoja nueva"], ["listo", "terminar"]].forEach(([h, etiqueta]) => {
      const b = document.createElement("button"); b.className = "herr" + (h === "listo" ? " listo" : ""); b.dataset.herr = h; b.setAttribute("aria-label", etiqueta); b.innerHTML = ICONOS[h];
      if (h === "deshacer") {
        let rep; b.addEventListener("pointerdown", () => { deshacer(); rep = setTimeout(function otra() { deshacer(); rep = setTimeout(otra, 280); }, 600); });
        ["pointerup", "pointerleave", "pointercancel"].forEach(ev => b.addEventListener(ev, () => clearTimeout(rep)));
      } else b.addEventListener("click", () => h === "listo" ? terminar() : h === "escoba" ? hojaNueva() : elegirHerramienta(h));
      $("botones").appendChild(b);
    });
    addEventListener("pagehide", guardar);

    // ---------- Arranque ----------
    function aviso(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
    (async () => {
      await analizar(LAMINA.url);
      let nuevo = null, viejo = null;
      try { nuevo = JSON.parse(localStorage.getItem(CLAVE)); } catch {}
      try { viejo = JSON.parse(localStorage.getItem(CLAVE_VIEJA)); } catch {}
      if (nuevo) {
        aplicarGuardado(nuevo);
        if (nuevo.trazo) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, N, N); im.src = nuevo.trazo; }
        lienzo.classList.toggle("brilla", !!nuevo.brillo);
      } else if (viejo?.rellenos && Object.keys(viejo.rellenos).length) {
        const n = migrarViejo(viejo); M.migrados = n; aviso(`Traje ${n} colores de tu dibujo anterior`);
        if (viejo.trazo) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, N, N); im.src = viejo.trazo; }   // el trazo era a 800: se estira a 1024
      }
      repintarTodo(); elegirHerramienta("balde", true);
      M.listo = true; M.regiones = { total: R.n, utiles: R.utiles, motitas: R.chicas, firma: R.firma };
      Juegos.decir(`Pinta ${LAMINA.nombre}`);
    })();
  </script>
</body>
