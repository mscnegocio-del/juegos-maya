:root { --ink:#3b2a4a; --rojo:#ff5a5f; --azul:#3fa7ff; --amarillo:#ffd23f; --verde:#4cd17a; --morado:#a66bff; --naranja:#ff9f43; --rosa:#ff7eb6; --turquesa:#2bb5a0; --radius:32px;
        --font:"Baloo 2","Comic Sans MS",system-ui,sans-serif; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; min-height:100%; color:var(--ink); font-family:var(--font); user-select:none; overflow-x:hidden; }
body { background:#fff7ec; }
/* Cielo que cambia de color muy despacio */
#cielo { position:fixed; inset:0; z-index:-3;
  background:linear-gradient(160deg,#ffe3f1,#e1f2ff 45%,#fff7ec 80%); background-size:200% 200%; animation:cielo 18s ease-in-out infinite alternate; }
@keyframes cielo { to { background-position:100% 100%; } }
.capa { position:fixed; inset:-40px; pointer-events:none; }
#lejos { z-index:-2; } #cerca { z-index:-1; }
.nube { position:absolute; width:150px; height:60px; background:#fff; border-radius:40px; opacity:.85; filter:drop-shadow(0 6px 0 rgba(59,42,74,.05)); }
.nube::before,.nube::after { content:""; position:absolute; background:#fff; border-radius:50%; }
.nube::before { width:70px; height:70px; left:22px; top:-34px; } .nube::after { width:54px; height:54px; left:76px; top:-22px; }
.estrella { position:absolute; width:22px; height:22px; }
.burbuja { position:absolute; border-radius:50%; border:3px solid rgba(255,255,255,.9); background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.15) 60%); }
.globito { position:absolute; width:46px; height:56px; }
.globito svg,.estrella svg { width:100%; height:100%; overflow:visible; }

header { text-align:center; padding:28px 16px 8px; position:relative; }
h1 { margin:0; font-size:clamp(46px,11vw,84px); font-weight:800; letter-spacing:2px; display:flex; justify-content:center; gap:2px; }
h1 span { display:inline-block; text-shadow:0 5px 0 rgba(59,42,74,.12); }
h1 span:nth-child(1){color:var(--rojo)} h1 span:nth-child(2){color:var(--azul)} h1 span:nth-child(3){color:var(--verde)} h1 span:nth-child(4){color:var(--morado)}
.sub { margin:0; font-size:22px; opacity:.75; min-height:30px; }

.menu { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(220px,40%),1fr)); gap:22px; max-width:1000px; margin:20px auto; padding:0 16px 120px; perspective:900px; }
.juego { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; aspect-ratio:1/1; border-radius:var(--radius);
  text-decoration:none; color:#fff; font-size:clamp(22px,5vw,30px); font-weight:800; box-shadow:0 10px 0 rgba(0,0,0,.15); overflow:hidden; transform-style:preserve-3d; }
.juego .icono { width:62%; aspect-ratio:1/1; background:#fff; border-radius:50%; padding:9%; box-shadow:0 6px 0 rgba(0,0,0,.12); position:relative; z-index:1; }
.juego .icono svg { width:100%; height:100%; overflow:visible; display:block; }
.juego .icono .foto { width:100%; height:100%; object-fit:cover; object-position:50% 8%; border-radius:50%; transform:scale(1.18); display:block; }
.juego .nombre { position:relative; z-index:1; text-shadow:0 3px 0 rgba(0,0,0,.12); }
.juego .brillo { position:absolute; top:-20%; bottom:-20%; width:40%; left:-60%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-15deg); pointer-events:none; }
.juego .puntos { position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 3px); background-size:22px 22px; pointer-events:none; }
/* Transición: la tarjeta tocada se convierte en un círculo que llena la pantalla */
.ola { position:fixed; border-radius:50%; z-index:50; pointer-events:none; }
.chispa { position:fixed; width:14px; height:14px; border-radius:50%; pointer-events:none; z-index:60; border:2px solid var(--ink); }

/* Panel del prototipo (solo para papá; no va en el sitio) */
.panel { position:fixed; left:50%; bottom:12px; transform:translateX(-50%); z-index:80; display:flex; gap:8px; background:#fff; padding:8px; border-radius:20px;
  box-shadow:0 6px 0 rgba(0,0,0,.12); font:700 15px var(--font); }
.panel button { font:inherit; border:0; background:#fff3c4; border-radius:14px; padding:10px 12px; color:var(--ink); cursor:pointer; }
.aviso { position:fixed; top:10px; right:10px; z-index:80; background:var(--ink); color:#fff; font:700 13px var(--font); padding:6px 10px; border-radius:12px; opacity:.8; }
@media (prefers-reduced-motion: reduce) { #cielo { animation:none; } }
</style>
</head>
<body>
<div id="cielo"></div>
<div class="capa" id="lejos"></div>
<div class="capa" id="cerca"></div>
<div class="aviso">PROTOTIPO</div>
<header>
  <h1 id="titulo"><span>M</span><span>a</span><span>y</span><span>a</span></h1>
  <p class="sub" id="sub"></p>
</header>
<main class="menu" id="menu"></main>
<div class="panel">
  <button id="otraVez">↻ Entrar de nuevo</button>
  <button id="barajar">🔀 Barajar</button>
</div>

const calma = matchMedia("(prefers-reduced-motion: reduce)").matches;
const R = gsap.utils.random;
const menu = document.getElementById("menu");
const mezclar = a => [...a].sort(() => Math.random() - .5);

// ---------- Fondo con profundidad: nubes y estrellas lejos, globitos y burbujas cerca ----------
const ESTRELLA = `<svg viewBox="0 0 100 100"><path d="M50 6 L62 38 L96 40 L69 60 L78 94 L50 74 L22 94 L31 60 L4 40 L38 38Z" fill="#ffd23f" stroke="#3b2a4a" stroke-width="6" stroke-linejoin="round"/></svg>`;
function fondo() {
  const lejos = document.getElementById("lejos"), cerca = document.getElementById("cerca");
  for (let i = 0; i < 5; i++) {
    const n = document.createElement("div"); n.className = "nube";
    n.style.cssText = `top:${R(4, 80)}%;left:${R(-10, 90)}%;transform:scale(${R(.5, 1.1)})`; lejos.appendChild(n);
    if (!calma) gsap.to(n, { x: R(80, 180), duration: R(18, 30), repeat: -1, yoyo: true, ease: "sine.inOut" });
  }
  for (let i = 0; i < 9; i++) {
    const s = document.createElement("div"); s.className = "estrella"; s.innerHTML = ESTRELLA;
    s.style.cssText = `top:${R(2, 95)}%;left:${R(2, 95)}%`; lejos.appendChild(s);
    if (!calma) gsap.fromTo(s, { scale: .4, rotation: 0, opacity: .3 }, { scale: R(.8, 1.2), rotation: 40, opacity: 1, duration: R(1.2, 2.4), repeat: -1, yoyo: true, ease: "sine.inOut", delay: R(0, 2) });
  }
  const COLORES = ["#ff5a5f", "#3fa7ff", "#ffd23f", "#4cd17a", "#a66bff", "#ff7eb6"];
  const subir = (el, primera) => {
    gsap.set(el, { x: R(0, innerWidth), y: primera ? R(0, innerHeight) : innerHeight + 120 });
    gsap.to(el, { y: -160, duration: R(14, 24) * (primera ? .6 : 1), ease: "none", onComplete: () => subir(el) });
    gsap.to(el, { x: "+=" + R(-60, 60), rotation: R(-12, 12), duration: R(2, 4), repeat: -1, yoyo: true, ease: "sine.inOut" });
  };
  for (let i = 0; i < 6; i++) {
    const g = document.createElement("div"); g.className = "globito"; g.innerHTML = Dibujos.globo(COLORES[i]); g.style.opacity = .55; cerca.appendChild(g);
    if (!calma) subir(g, true); else gsap.set(g, { x: R(0, innerWidth), y: R(0, innerHeight) });
  }
  for (let i = 0; i < 8; i++) {
    const b = document.createElement("div"); b.className = "burbuja"; const t = R(14, 40); b.style.width = b.style.height = t + "px"; cerca.appendChild(b);
    if (!calma) subir(b, true); else gsap.set(b, { x: R(0, innerWidth), y: R(0, innerHeight) });
  }
  // Paralaje: el fondo se mueve un poquito con el dedo (o al inclinar la tablet)
  if (calma) return;
  const mover = (fx, fy) => { gsap.to("#lejos", { x: fx * -14, y: fy * -10, duration: 1.2 }); gsap.to("#cerca", { x: fx * -32, y: fy * -22, duration: 1.2 }); };
  addEventListener("pointermove", e => mover(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));
  addEventListener("deviceorientation", e => e.gamma != null && mover(e.gamma / 45, (e.beta - 45) / 45));
}

// ---------- Tarjetas en orden aleatorio cada vez ----------
let idle = [];
function armarMenu() {
  idle.forEach(t => t.kill()); idle = [];
  menu.innerHTML = "";
  mezclar(JUEGOS).forEach(j => {
    const a = document.createElement("a");
    a.className = "juego"; a.href = "#"; a.style.background = j.color; if (j.tinta) a.style.color = "var(--ink)";
    a.innerHTML = `<span class="puntos"></span><span class="brillo"></span><span class="icono">${j.icono}</span><span class="nombre">${j.nombre}</span>`;
    a.addEventListener("click", e => { e.preventDefault(); tocar(a, j); });
    menu.appendChild(a);
  });
}

function entrada() {
  if (calma) return;
  const cartas = [...menu.children];
  gsap.from("h1 span", { y: -140, rotation: () => R(-40, 40), scale: .3, opacity: 0, duration: 1, stagger: .09, ease: "bounce.out" });
  // Cada tarjeta llega desde una dirección distinta, girando, y rebota al aterrizar
  gsap.from(cartas, { x: () => R(-300, 300), y: () => R(200, 500), rotation: () => R(-60, 60), rotationY: () => R(-90, 90), scale: .3, opacity: 0,
    duration: .9, stagger: { each: .07, from: "random" }, delay: .2, ease: "back.out(1.6)", clearProps: "transform,opacity",
    onComplete: flotar });
  gsap.from(".icono", { scale: 0, rotation: -180, duration: .7, stagger: .07, delay: .55, ease: "back.out(2.4)", clearProps: "transform" });
  escribir("¿A qué jugamos hoy?");
}

// Reposo: título que ondea, tarjetas que flotan suave y un destello que pasa por alguna tarjeta
function flotar() {
  if (calma) return;
  idle.push(gsap.to("h1 span", { y: -10, duration: .6, stagger: { each: .12, repeat: -1, yoyo: true }, ease: "sine.inOut" }));
  [...menu.children].forEach((c, i) => {
    idle.push(gsap.to(c, { y: R(-6, -3), rotation: R(-1.5, 1.5), duration: R(1.6, 2.4), repeat: -1, yoyo: true, ease: "sine.inOut", delay: i * .15 }));
    idle.push(gsap.to(c.querySelector(".icono"), { y: -6, duration: R(1, 1.6), repeat: -1, yoyo: true, ease: "sine.inOut", delay: i * .2 }));
  });
  const destello = () => {
    const c = gsap.utils.random([...menu.children]);
    gsap.fromTo(c.querySelector(".brillo"), { left: "-60%" }, { left: "130%", duration: .9, ease: "power2.inOut" });
    gsap.timeline().to(c.querySelector(".icono"), { y: -22, scaleY: 1.1, duration: .2, ease: "power2.out" }).to(c.querySelector(".icono"), { y: 0, scaleY: 1, duration: .6, ease: "bounce.out" });
  };
  idle.push(gsap.delayedCall(1.2, function repetir() { destello(); idle.push(gsap.delayedCall(2.6, repetir)); }));
}

// Subtítulo que aparece letra por letra
function escribir(texto) {
  const s = document.getElementById("sub"); s.textContent = "";
  [...texto].forEach((ch, i) => setTimeout(() => (s.textContent += ch), 700 + i * 45));
}

// Toque: aplasta y estira, salen chispitas y la tarjeta se abre en un círculo de su color
function tocar(a, j) {
  const r = a.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  if ("speechSynthesis" in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(j.nombre); u.lang = "es-ES"; u.pitch = 1.2; speechSynthesis.speak(u); }
  if (calma) return;
  gsap.timeline({ defaults: { transformOrigin: "50% 100%" } })
    .to(a, { scaleX: 1.15, scaleY: .85, duration: .09 }).to(a, { scaleX: .92, scaleY: 1.1, duration: .12 }).to(a, { scaleX: 1, scaleY: 1, duration: .5, ease: "elastic.out(1.1,.35)" });
  gsap.fromTo(a.querySelector(".icono > *"), { rotation: -18 }, { rotation: 0, duration: .8, ease: "elastic.out(1.2,.3)" });
  ["#ff5a5f", "#3fa7ff", "#ffd23f", "#4cd17a", "#a66bff", "#ff7eb6"].forEach((c, i) => {
    for (let k = 0; k < 2; k++) {
      const p = document.createElement("div"); p.className = "chispa"; p.style.background = c; document.body.appendChild(p);
      const ang = (i * 2 + k) / 12 * Math.PI * 2, d = R(80, 150);
      gsap.fromTo(p, { left: cx - 7, top: cy - 7 }, { x: Math.cos(ang) * d, y: Math.sin(ang) * d, scale: 0, duration: .7, ease: "power3.out", onComplete: () => p.remove() });
    }
  });
  const ola = document.createElement("div"); ola.className = "ola"; ola.style.background = getComputedStyle(a).backgroundColor; document.body.appendChild(ola);
  const radio = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
  gsap.fromTo(ola, { left: cx, top: cy, width: 0, height: 0 }, { left: cx - radio, top: cy - radio, width: radio * 2, height: radio * 2, duration: .7, delay: .45, ease: "power2.in",
    onComplete: () => gsap.to(ola, { opacity: 0, duration: .5, delay: .4, onComplete: () => ola.remove() }) }); // en el sitio aquí se abriría el juego
}

document.getElementById("otraVez").onclick = () => { armarMenu(); entrada(); };
document.getElementById("barajar").onclick = () => {
  // Las tarjetas vuelan a su nuevo lugar (técnica FLIP)
  const antes = new Map([...menu.children].map(c => [c.querySelector(".nombre").textContent, c.getBoundingClientRect()]));
  idle.forEach(t => t.kill()); idle = []; gsap.set(menu.children, { clearProps: "transform" });
  mezclar([...menu.children]).forEach(c => menu.appendChild(c));
  [...menu.children].forEach(c => {
    const a = antes.get(c.querySelector(".nombre").textContent), b = c.getBoundingClientRect();
    gsap.from(c, { x: a.left - b.left, y: a.top - b.top, rotation: R(-20, 20), duration: .8, ease: "back.out(1.4)", clearProps: "transform" });
  });
  gsap.delayedCall(.9, flotar);
};

fondo(); armarMenu(); entrada();
if (calma) document.getElementById("sub").textContent = "¿A qué jugamos hoy?";
</script>
</body>
