:root{--ink:#3b2a4a;--amarillo:#ffd23f;--rosa:#ff7eb6;--verde:#4cd17a;--font:"Baloo 2","Comic Sans MS",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:var(--font);user-select:none;touch-action:none}
body{background:linear-gradient(#efe4ff,#fff7ec)}
.casa{position:fixed;top:16px;left:16px;width:72px;height:72px;border-radius:50%;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);display:grid;place-items:center;z-index:50}
.casa svg{width:46px;height:46px}
.aviso{position:fixed;top:10px;right:10px;background:var(--ink);color:#fff;font:700 13px var(--font);padding:6px 10px;border-radius:12px;opacity:.8;z-index:80}
#estrellas{position:fixed;top:98px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
.punto{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:#fff;transition:background .3s}
.punto.lleno{background:var(--amarillo)}
#escenario{position:fixed;inset:0}
#tablero{position:absolute;border-radius:18px;background:#fff;box-shadow:0 8px 0 rgba(0,0,0,.1);padding:0}
#tablero>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#fantasma{opacity:.16;filter:grayscale(1)}
body.sinayuda #fantasma{opacity:0}
.pieza{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(0 4px 3px rgba(59,42,74,.28));will-change:transform}
.pieza svg{display:block;overflow:visible;pointer-events:none}
.pieza.puesta{cursor:default;pointer-events:none;filter:none}
.pieza.arrastra{filter:drop-shadow(0 14px 8px rgba(59,42,74,.3));z-index:40}
.hueco-brilla path{stroke:#ffd23f;stroke-width:3;animation:titilar .6s ease-in-out infinite alternate}
@keyframes titilar{to{stroke-opacity:.2}}
.lava{position:fixed;border-radius:50%;pointer-events:none;z-index:55}
.humo{position:fixed;border-radius:50%;background:#cfc7d6;pointer-events:none;z-index:54;border:3px solid var(--ink)}
.grito{position:fixed;z-index:62;pointer-events:none;font:800 34px var(--font);color:#fff;text-shadow:0 5px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),0 -3px 0 var(--ink);letter-spacing:3px;white-space:nowrap}
.huella{position:fixed;z-index:30;pointer-events:none}
.destello-fondo{position:fixed;inset:0;z-index:20;pointer-events:none;background:radial-gradient(circle at 80% 30%,#ff9f43,transparent 60%);opacity:0}
.confeti{position:fixed;width:12px;height:12px;border-radius:3px;pointer-events:none;z-index:60}
.panel{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:70;display:flex;gap:6px;background:#fff;padding:6px;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.12);font:700 14px var(--font);max-width:calc(100vw - 12px)}
.panel button{font:inherit;border:0;background:#fff3c4;border-radius:12px;padding:9px 10px;color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion:reduce){.hueco-brilla path{animation:none}}
</style></head><body>

 estego:Dibujos.svg(`<path d="M38 134 Q8 130 4 160 Q30 146 46 152Z" fill="#ffb86b"/><path d="M10 148 l-6 -10 M18 142 l-6 -10" stroke-width="4" fill="none"/>

  <ellipse cx="162" cy="140" rx="30" ry="22" fill="#ffb86b"/>${OJO(172,134,6)}<path d="M162 150 Q176 156 190 148" fill="none" stroke-width="4"/>`,{cabeza:false}),
};
const CUADROS=[
 {id:"trex",nombre:"el tiranosaurio",cielo:"#ffe3c4",vida:"saltar",dino:1},{id:"trice",nombre:"el tricerátops",cielo:"#d4efff",vida:"latir",dino:1},
 {id:"bronto",nombre:"el braquiosaurio",cielo:"#e3f6d0",vida:"latir",dino:1},{id:"estego",nombre:"el estegosaurio",cielo:"#ffe0ec",vida:"saltar",dino:1},
 {id:"pato",nombre:"el pato",cielo:"#bfe6ff",vida:"nadar"},{id:"vaca",nombre:"la vaca",cielo:"#d9f0ff",vida:"saltar"},
 {id:"perro",nombre:"el perrito",cielo:"#ffe9c9",vida:"saltar"},{id:"gato",nombre:"el gatito",cielo:"#e9dcff",vida:"latir"},
 {id:"chancho",nombre:"el chanchito",cielo:"#ffe0ec",vida:"saltar"},{id:"rana",nombre:"la ranita",cielo:"#d4f5dd",vida:"saltar"}];
let capa=10, cuadro=+(new URLSearchParams(location.search).get('c')||0), k=1, piezas=[], puestas=0;

function escena(c){
  const animal=(c.dino?DINOS[c.id]:Dibujos.ANIMALES[c.id]).replace("<svg ",'<svg x="88" y="0" width="124" height="124" ');
  const flores=[[20,104],[60,110],[250,106],[282,112],[226,114]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="5" fill="${["#ff5a5f","#ffd23f","#ff7eb6","#a66bff","#3fa7ff"][i]}" stroke="${T}" stroke-width="2"/>`).join("");
  return `<rect width="300" height="120" fill="${c.cielo}"/>
    <circle cx="40" cy="28" r="15" fill="#ffd23f" stroke="${T}" stroke-width="3"/>
    <g fill="#fff" stroke="${T}" stroke-width="3" stroke-linejoin="round"><path d="M214 36 q-4 -14 12 -14 q6 -12 22 -4 q18 -2 16 14 q-2 6 -10 6 h-30 q-10 0 -10 -2z"/></g>
    ${c.dino?`<path d="M222 90 L252 40 L282 90Z" fill="#c98b5b" stroke="${T}" stroke-width="3" stroke-linejoin="round"/><path d="M243 52 L252 40 L261 52 Q252 58 243 52Z" fill="#ff7a3d" stroke="${T}" stroke-width="2"/>`:""}
    <path d="M0 96 Q80 66 150 92 T300 84 L300 120 L0 120Z" fill="#7fd68a" stroke="${T}" stroke-width="3"/>${flores}${animal}`;
}

// Borde con lengüeta: d = +1 sale, -1 entra, 0 plano. A→B con normal hacia afuera
function borde(A,B,d){
  if(!d) return ` L ${B[0]} ${B[1]}`;
  const ux=(B[0]-A[0])/LADO, uy=(B[1]-A[1])/LADO, nx=uy*d, ny=-ux*d, H=12;
  const p=(t,h)=>`${(A[0]+ux*LADO*t+nx*h).toFixed(1)} ${(A[1]+uy*LADO*t+ny*h).toFixed(1)}`;
  return ` L ${p(.40,0)} C ${p(.40,.3*H)} ${p(.33,.35*H)} ${p(.33,.65*H)} C ${p(.33,1.0*H)} ${p(.67,1.0*H)} ${p(.67,.65*H)} C ${p(.67,.35*H)} ${p(.60,.3*H)} ${p(.60,0)} L ${B[0]} ${B[1]}`;
}
function trazado(c,r){
  const x=c*LADO,y=r*LADO, s=(a,b)=>((a+b)%2?1:-1);
  const arr=r>0?-s(c,r-1)*-1*-1:0;      // se calcula abajo con claridad
  const top=r>0?-vert(c,r-1):0, bottom=r<ROWS-1?vert(c,r):0, right=c<COLS-1?horiz(c,r):0, left=c>0?-horiz(c-1,r):0;
  return `M ${x} ${y}`+borde([x,y],[x+LADO,y],top)+borde([x+LADO,y],[x+LADO,y+LADO],right)+borde([x+LADO,y+LADO],[x,y+LADO],bottom)+borde([x,y+LADO],[x,y],left)+" Z";
}
const horiz=(c,r)=>((c+r)%2?1:-1), vert=(c,r)=>((c+r)%2?-1:1);

function medir(){
  const Wp=Math.min(innerWidth-24,640); k=Wp/W0;
  const t=document.getElementById("tablero");
  t.style.width=Wp+"px"; t.style.height=H0*k+"px"; t.style.left=(innerWidth-Wp)/2+"px"; t.style.top=Math.max(140,innerHeight*.18)+"px";
}
const origen=p=>{const t=document.getElementById("tablero");return{x:t.offsetLeft+(p.c*LADO-P)*k,y:t.offsetTop+(p.r*LADO-P)*k}};

function armar(){
  const c=CUADROS[cuadro], e=document.getElementById("escenario"), t=document.getElementById("tablero");
  e.querySelectorAll(".pieza").forEach(x=>x.remove()); piezas=[]; puestas=0;
  document.getElementById("defs").innerHTML=`<g id="escena">${escena(c)}</g>`;
  medir();
  let fantasma=`<g id="fantasma"><use href="#escena"/></g>`, huecos="";
  for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){
    const d=trazado(col,r); huecos+=`<path data-h="${col}-${r}" d="${d}" fill="none" stroke="${T}" stroke-opacity=".28" stroke-width="1.6" stroke-dasharray="4 4"/>`;
  }
  t.innerHTML=`<svg viewBox="0 0 ${W0} ${H0}">${fantasma}<g id="huecos">${huecos}</g></svg>`;
  document.getElementById("estrellas").innerHTML=Array.from({length:COLS*ROWS},()=>`<span class="punto"></span>`).join("");
  const tw=(P*2+LADO)*k, cols=Math.max(3,Math.floor((innerWidth-8)/(tw*.95))), celda=(innerWidth-8)/cols, zonaY=t.offsetTop+H0*k+30, zonaAlto=innerHeight-zonaY-80;
  const filas=Math.ceil(COLS*ROWS/cols), alto=Math.min(tw*1.05,(innerHeight-tw-104-zonaY)/Math.max(1,filas-1));
  const celdas=[]; for(let i=0;i<cols*filas;i++)celdas.push(i);
  gsap.utils.shuffle(celdas);
  for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){
    const d=trazado(col,r), id="c"+col+"-"+r, el=document.createElement("div");
    el.className="pieza";
    el.innerHTML=`<svg width="${tw}" height="${tw}" viewBox="${col*LADO-P} ${r*LADO-P} ${LADO+2*P} ${LADO+2*P}">
      <defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs>
      <g clip-path="url(#${id})"><use href="#escena"/></g><path d="${d}" fill="none" stroke="${T}" stroke-width="2.2" stroke-linejoin="round"/></svg>`;
    document.getElementById("escenario").appendChild(el);
    const n=celdas.pop(), cx=(n%cols)*celda+8+R(-6,6), cy=zonaY+Math.floor(n/cols)*alto+R(-4,4);
    const p={c:col,r,el,puesta:false,rot:R(-8,8)}; piezas.push(p);
    gsap.set(el,{x:Math.min(cx,innerWidth-tw-4),y:Math.min(cy,innerHeight-tw-60),rotation:p.rot});
    arrastrable(p);
  }
  if(!calma) gsap.from(piezas.map(p=>p.el),{y:"+=380",scale:.3,opacity:0,rotation:()=>R(-90,90),duration:.8,stagger:{each:.06,from:"random"},ease:"back.out(1.6)"});
  hablar(`Arma ${c.nombre}`);
  reloj();
}

function arrastrable(p){
  let dx,dy,ini=null;
  p.el.addEventListener("pointerdown",e=>{ if(p.puesta)return; p.el.setPointerCapture(e.pointerId); p.el.classList.add("arrastra");
    const q=gsap.getProperty(p.el,"x"), w=gsap.getProperty(p.el,"y"); dx=e.clientX-q; dy=e.clientY-w; ini=1; ultimo=Date.now();
    gsap.to(p.el,{scale:1.1,rotation:0,duration:.15}); sonido(520,.05);
    p.el.style.zIndex=++capa; }); // z-index en vez de mover el nodo: mover el nodo suelta el dedo
  p.el.addEventListener("pointermove",e=>{ if(!ini)return; gsap.set(p.el,{x:e.clientX-dx,y:e.clientY-dy});
    const o=origen(p), cerca=Math.hypot(gsap.getProperty(p.el,"x")-o.x,gsap.getProperty(p.el,"y")-o.y)<70*k/1.2;
    resaltar(p,cerca); });
  const soltar=()=>{ if(!ini)return; ini=null; p.el.classList.remove("arrastra"); resaltar(p,false);
    const o=origen(p), x=gsap.getProperty(p.el,"x"), y=gsap.getProperty(p.el,"y");
    if(Math.hypot(x-o.x,y-o.y)<70*k/1.2){ encajar(p,o); } else gsap.to(p.el,{scale:1,rotation:p.rot,duration:.3,ease:"back.out(2)"}); };
  p.el.addEventListener("pointerup",soltar); p.el.addEventListener("pointercancel",soltar);
}
function resaltar(p,si){ const h=document.querySelector(`[data-h="${p.c}-${p.r}"]`); h&&h.parentNode.classList.toggle("hueco-brilla",false); if(h) h.setAttribute("stroke-opacity",si?".9":".28"); if(h)h.setAttribute("stroke",si?"#ffd23f":T); }
function encajar(p,o){
  p.puesta=true; p.el.classList.add("puesta"); puestas++; document.querySelectorAll(".punto")[puestas-1].classList.add("lleno");
  gsap.to(p.el,{x:o.x,y:o.y,scale:1,rotation:0,duration:.25,ease:"back.out(2)"}); sonido(660+puestas*60,.14,"triangle");
  p.el.style.zIndex=1; // las puestas quedan debajo de las que faltan
  const h=document.querySelector(`[data-h="${p.c}-${p.r}"]`); h&&h.remove();
  if(!calma){ gsap.fromTo(p.el.querySelector("svg"),{scale:1.1},{scale:1,duration:.4,ease:"elastic.out(1.2,.4)"}); chispas(o.x+(P+LADO/2)*k,o.y+(P+LADO/2)*k,6); }
  if(puestas===COLS*ROWS) terminar(); else if(puestas===3||puestas===6) hablar(["","","","¡Muy bien!","","","¡Qué bonito va!"][puestas]);
}
// ---------- Despertar del dinosaurio: volcán que erupciona, pasos que hacen temblar, rugido y huellas ----------
function rugido(){ try{ ac??=new AudioContext(); const t=ac.currentTime, o=ac.createOscillator(), l=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain(), v=ac.createGain();
  o.type="sawtooth"; o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(70,t+1.1); l.frequency.value=22; v.gain.value=18; l.connect(v).connect(o.frequency);
  f.type="lowpass"; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(260,t+1.1);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.12); g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
  o.connect(f).connect(g).connect(ac.destination); o.start(t); l.start(t); o.stop(t+1.25); l.stop(t+1.25);}catch{} }
function paso(n){ try{ ac??=new AudioContext(); const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(90,t); o.frequency.exponentialRampToValueAtTime(40,t+.18);
  g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.22);}catch{} }
const HUELLA=`<svg viewBox="0 0 60 60" width="46" height="46" fill="#a9825a" stroke="${T}" stroke-width="3" stroke-linejoin="round"><path d="M30 56 L18 40 Q30 34 42 40Z"/><path d="M16 36 L8 14 L22 22Z"/><path d="M30 32 L30 6 L40 28Z"/><path d="M44 36 L52 14 L38 22Z"/></svg>`;
function despertar(c){
  const tb=document.getElementById("tablero"), tr=tb.getBoundingClientRect();
  const X=u=>tr.left+u*k, Y=u=>tr.top+u*k;
  const cuerpo=document.getElementById("escenario");
  const ic=new Image();
  // 1. pasos que hacen temblar toda la pantalla, con huellas que van apareciendo en el pasto
  [0,1,2,3].forEach(i=>gsap.delayedCall(.2+i*.38,()=>{ paso(); 
    gsap.fromTo(cuerpo,{y:0},{y:"+=7",duration:.06,yoyo:true,repeat:3,clearProps:"y"});
    const h=document.createElement("div"); h.className="huella"; h.innerHTML=HUELLA; document.body.appendChild(h);
    gsap.set(h,{left:X(46+i*52)-23,top:Y(104),rotation:i%2?12:-12,scale:0});
    gsap.to(h,{scale:1,duration:.3,ease:"back.out(3)"}); gsap.to(h,{opacity:0,duration:1,delay:2.4,onComplete:()=>h.remove()});
  }));
  // 2. el volcán erupciona: lava que sube y cae con gravedad, humo que se hincha y destello naranja
  gsap.delayedCall(1.7,()=>{
    const fl=document.createElement("div"); fl.className="destello-fondo"; document.body.appendChild(fl);
    gsap.to(fl,{opacity:.7,duration:.15,yoyo:true,repeat:1,onComplete:()=>fl.remove()});
    const bx=X(252), by=Y(40);
    for(let i=0;i<26;i++){ const e=document.createElement("div"); e.className="lava"; const s=R(10,20); e.style.cssText=`width:${s}px;height:${s}px;background:${["#ff5a5f","#ff9f43","#ffd23f"][i%3]};border:2px solid ${T}`; document.body.appendChild(e);
      gsap.set(e,{left:bx-s/2,top:by});
      const tl=gsap.timeline({onComplete:()=>e.remove()}); const dx=R(-110,110), alto=R(50,120);
      tl.to(e,{x:dx*.55,y:-alto,duration:R(.5,.8),ease:"power2.out"}).to(e,{x:dx,y:R(40,140),opacity:0,duration:R(.7,1.1),ease:"power2.in"}); }
    for(let i=0;i<7;i++){ const h=document.createElement("div"); h.className="humo"; const s=R(26,50); h.style.cssText=`width:${s}px;height:${s}px`; document.body.appendChild(h);
      gsap.set(h,{left:bx-s/2+R(-14,14),top:by-10,scale:.2,opacity:.9});
      gsap.to(h,{y:-R(60,110),x:R(-60,60),scale:R(1.4,2.2),opacity:0,duration:R(1.6,2.4),delay:i*.1,ease:"power1.out",onComplete:()=>h.remove()}); }
  });
  // 3. rugido: letras que explotan sobre la cabeza del dino; el dibujo entero se infla y sacude
  gsap.delayedCall(1.9,()=>{ rugido(); hablar("¡Raaar!");
    const g=document.createElement("div"); g.className="grito"; g.textContent="¡RAAAR!"; document.body.appendChild(g);
    const w=g.offsetWidth; gsap.set(g,{left:Math.max(8,Math.min(innerWidth-w-8,X(150)-w/2)),top:Y(0)-46});
    gsap.fromTo(g,{scale:0,rotation:-14},{scale:1.2,rotation:6,duration:.45,ease:"back.out(3)"});
    gsap.to(g,{x:"+=5",y:"+=3",duration:.05,repeat:14,yoyo:true}); gsap.to(g,{opacity:0,scale:1.6,duration:.5,delay:1.5,onComplete:()=>g.remove()});
    const todas=[tb,...piezas.map(p=>p.el)];
    gsap.to(todas,{scale:1.05,duration:.25,yoyo:true,repeat:5,ease:"sine.inOut"});
    gsap.to(todas,{rotation:1.2,duration:.06,yoyo:true,repeat:21,ease:"none"});
  });
}
function terminar(){
  const c=CUADROS[cuadro];
  document.querySelectorAll(".pieza path").forEach(x=>x.setAttribute("stroke-opacity",0)); // se funden las líneas: queda el dibujo entero
  const t=document.getElementById("tablero"), todas=[t,...piezas.map(p=>p.el)];
  hablar(`¡Muy bien! Armaste ${c.nombre}`); fiesta();
  if(calma) return;
  if(c.dino) despertar(c);
  const mov=c.dino?{y:"-=0",duration:.01}:{saltar:{y:"-=40",duration:.3,yoyo:true,repeat:5,ease:"power2.out"},nadar:{x:"+=26",duration:.35,yoyo:true,repeat:5,ease:"sine.inOut"},latir:{scale:1.06,duration:.3,yoyo:true,repeat:5,ease:"sine.inOut"}}[c.vida]; // relativo y con yoyo par: vuelve solo a su lugar
  gsap.to(todas,{...mov,overwrite:false});
  setTimeout(()=>{ cuadro=(cuadro+1)%CUADROS.length; armar(); },c.dino?6800:5200);
}
function chispas(x,y,n){ for(let i=0;i<n;i++){ const c=document.createElement("div"); c.className="confeti"; c.style.background=["#ff5a5f","#ffd23f","#3fa7ff","#4cd17a","#a66bff"][i%5]; c.style.borderRadius="50%"; document.body.appendChild(c);
  gsap.fromTo(c,{left:x,top:y},{x:R(-70,70),y:R(-70,70),scale:0,duration:.6,ease:"power3.out",onComplete:()=>c.remove()}); } }
function fiesta(){ if(calma)return; for(let i=0;i<46;i++){ const c=document.createElement("div"); c.className="confeti"; c.style.background=["#ff5a5f","#ffd23f","#3fa7ff","#4cd17a","#a66bff","#ff7eb6"][i%6]; document.body.appendChild(c);
  gsap.set(c,{left:innerWidth/2,top:innerHeight*.8}); gsap.timeline({onComplete:()=>c.remove()}).to(c,{x:R(-innerWidth/2,innerWidth/2),y:-innerHeight*R(.4,.8),duration:R(.6,.9),ease:"power2.out"}).to(c,{y:innerHeight*.3,opacity:0,duration:R(1.4,2.2),ease:"power1.in"});
  gsap.to(c,{rotation:R(-720,720),duration:2.5}); } [523,659,784,1047].forEach((f,i)=>setTimeout(()=>sonido(f,.2,"triangle"),i*110)); }
let ac; function sonido(f,d=.1,tipo="sine"){ try{ ac??=new AudioContext(); const o=ac.createOscillator(),g=ac.createGain(); o.type=tipo;o.frequency.value=f;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch{} }
function hablar(t){ if(!t||!("speechSynthesis" in window))return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="es-ES"; u.pitch=1.2; u.rate=.9; speechSynthesis.speak(u); }

// Ayuda suave: si pasan unos segundos sin tocar, una pieza que falta parpadea y su hueco brilla
let ultimo=Date.now(), pista;
function reloj(){ clearInterval(pista); pista=setInterval(()=>{ if(Date.now()-ultimo<9000||puestas>=COLS*ROWS)return;
  const p=piezas.find(x=>!x.puesta); if(!p)return; ultimo=Date.now(); hablar("¿Dónde va esta pieza?");
  gsap.fromTo(p.el,{scale:1},{scale:1.18,duration:.3,yoyo:true,repeat:3}); const h=document.querySelector(`[data-h="${p.c}-${p.r}"]`); if(h){h.setAttribute("stroke","#ffd23f");h.setAttribute("stroke-opacity",".95");h.setAttribute("stroke-width","3");setTimeout(()=>{h.setAttribute("stroke",T);h.setAttribute("stroke-opacity",".28");h.setAttribute("stroke-width","1.6")},2500);} },2000); }

document.getElementById("otro").onclick=()=>{cuadro=(cuadro+1)%CUADROS.length;armar()};
document.getElementById("revolver").onclick=armar;
document.getElementById("ayuda").onclick=e=>{document.body.classList.toggle("sinayuda");e.target.textContent="👻 Ayuda: "+(document.body.classList.contains("sinayuda")?"no":"sí")};
addEventListener("resize",armar);
armar();
