<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#fff7ec">
  <title>Juegos de Maya</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/iconos/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/iconos/icono-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Maya">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body {
      min-height: 100%;
      background:
        radial-gradient(circle at 10% 10%, #ffe3f1 0 120px, transparent 121px),
        radial-gradient(circle at 90% 85%, #e1f2ff 0 160px, transparent 161px),
        var(--bg);
    }
    header { text-align: center; padding: 28px 16px 8px; }
    h1 {
      margin: 0;
      font-size: clamp(40px, 9vw, 72px);
      font-weight: 800;
      letter-spacing: 1px;
    }
    h1 span:nth-child(1) { color: var(--rojo); }
    h1 span:nth-child(2) { color: var(--azul); }
    h1 span:nth-child(3) { color: var(--verde); }
    h1 span:nth-child(4) { color: var(--morado); }
    .sub { margin: 0; font-size: 22px; opacity: .7; }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(220px, 40%), 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }
    .juego {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius);
      text-decoration: none;
      color: #fff;
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 800;
      box-shadow: 0 10px 0 rgba(0, 0, 0, .15);
      transition: transform .15s, box-shadow .15s;
    }
    /* Con número impar de juegos, en celular (2 columnas) el último ocupa la fila entera */
    @media (max-width: 600px) {
      .juego:last-child:nth-child(odd) { grid-column: 1 / -1; aspect-ratio: 2 / 1; flex-direction: row; gap: 18px; }
      .juego:last-child:nth-child(odd) .icono { width: auto; height: 70%; padding: 14px; }
    }
    .juego:active { transform: translateY(8px); box-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
    .juego .icono {
      width: 62%; aspect-ratio: 1 / 1;
      background: #fff; border-radius: 50%;
      padding: 9%;
      box-shadow: 0 6px 0 rgba(0, 0, 0, .12);
    }
    .juego .icono svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .juego .icono .foto { width: 100%; height: 100%; display: block; object-fit: cover; object-position: 50% 8%;
                          border-radius: 50%; transform: scale(1.18); pointer-events: none; }
    .juego:hover .icono svg { animation: wiggle .5s; }

    /* Rincón de papá: esquina invisible (mantener 3 s) que abre el panel de progreso. Lo leen los adultos */
    #rincon { position: fixed; top: 0; right: 0; width: 90px; height: 90px; z-index: 60; touch-action: none; -webkit-touch-callout: none; }
    #panel[hidden] { display: none; }
    #panel { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(59, 42, 74, .55); padding: 16px; }
    #panel .caja { background: #fff; border-radius: 24px; padding: 20px; width: min(440px, 100%); max-height: 90dvh; overflow: auto;
                   box-shadow: 0 10px 0 rgba(0, 0, 0, .15); }
    #panel h2 { margin: 0 0 4px; font-size: 26px; }
    #panel p { margin: 0 0 12px; opacity: .7; font-size: 16px; line-height: 1.3; }
    #panel .fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 0; border-top: 2px solid #f3ebe0; font-size: 20px; }
    #panel .fila b { flex: 1 0 100%; }
    #panel .fila span { min-width: 104px; text-align: center; }
    #panel .fila .peligro { margin-left: auto; }
    #panel button { min-width: 48px; height: 48px; border-radius: 14px; background: #fff3c4; font-weight: 800; font-size: 20px; padding: 0 12px; }
    #panel .peligro { background: #ffe0e1; }
    #panel .acciones { display: flex; gap: 10px; justify-content: space-between; margin-top: 14px; }
  </style>
</head>
<body>
  <header>
    <h1><span>M</span><span>a</span><span>y</span><span>a</span></h1>
    <p class="sub">¿A qué jugamos hoy?</p>
  </header>

  <main class="menu">
    <a class="juego" href="juegos/globos/" data-voz="Globos" style="background: var(--rojo)">
      <span class="icono" data-dibujo="globo"></span>Globos
    </a>
    <a class="juego" href="juegos/animales/" data-voz="Animales" style="background: var(--verde)">
      <span class="icono" data-dibujo="vaca"></span>Animales
    </a>
    <a class="juego" href="juegos/colores/" data-voz="Colores" style="background: var(--azul)">
      <span class="icono" data-dibujo="paleta"></span>Colores
    </a>
    <a class="juego" href="juegos/pintar/" data-voz="A pintar" style="background: var(--morado)">
      <span class="icono" data-dibujo="crayon"></span>Pintar
    </a>
    <a class="juego" href="juegos/contar/" data-voz="A contar" style="background: var(--naranja)">
      <span class="icono" data-dibujo="manzana"></span>Contar
    </a>
    <a class="juego" href="juegos/piano/" data-voz="Piano" style="background: var(--rosa)">
      <span class="icono" data-dibujo="piano"></span>Piano
    </a>
    <a class="juego" href="juegos/gato/" data-voz="Michi" style="background: var(--turquesa)">
      <span class="icono" data-dibujo="michi"></span>Michi
    </a>
  </main>

  <div id="rincon" aria-hidden="true"></div>
  <div id="panel" hidden></div>

  <script src="assets/vendor/gsap/gsap.min.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/dibujos.js"></script>
  <script>
    const ICONOS = {
      globo: Dibujos.globo("#ff5a5f"), vaca: Dibujos.ANIMALES.vaca, paleta: Dibujos.paleta,
      crayon: Dibujos.crayon, manzana: Dibujos.OBJETOS_CONTAR[0].dibujo, piano: Dibujos.piano,
      michi: '<img class="foto" src="assets/img/michi/feliz.webp" alt="">', // la misma imagen que en el juego
    };
    document.querySelectorAll(".icono").forEach(i => (i.innerHTML = ICONOS[i.dataset.dibujo]));

    // Dice el nombre del juego y luego entra, para que la niña asocie dibujo y palabra
    document.querySelectorAll(".juego").forEach(a => {
      a.addEventListener("click", e => {
        e.preventDefault();
        Juegos.decir(a.dataset.voz);
        a.classList.add("sonando"); // el dibujo abre la boca y se mueve
        Juegos.rebotar(a);
        const dibujo = a.querySelector(".icono > *");
        if (window.gsap && !calma) gsap.fromTo(dibujo, { rotation: -14 }, { rotation: 0, duration: .7, ease: "elastic.out(1.2, .3)" });
        else Juegos.animar(dibujo, "wiggle");
        setTimeout(() => Juegos.irA(a.href), 650);
      });
    });

    // ---------- Rincón de papá ----------
    const NOMBRES = Object.fromEntries([...document.querySelectorAll(".juego")].map(a => [a.getAttribute("href").split("/")[1], a.textContent.trim()]));
    const panel = document.getElementById("panel"), rincon = document.getElementById("rincon");
    let espera;
    rincon.addEventListener("pointerdown", e => { e.preventDefault(); espera = setTimeout(abrirPanel, 3000); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => rincon.addEventListener(ev, () => clearTimeout(espera)));
    rincon.addEventListener("contextmenu", e => e.preventDefault());

    function abrirPanel() {
      Juegos.tono(880, .12);
      pintarPanel();
      panel.hidden = false;
      if (window.gsap && !calma) gsap.from("#panel .caja", { scale: .8, opacity: 0, duration: .4, ease: "back.out(2)" });
    }
    function pintarPanel() {
      const juegos = Juegos.progreso.juegos();
      panel.innerHTML = `<div class="caja" role="dialog" aria-label="Rincón de papá">
        <h2>Rincón de papá</h2>
        <p>Nivel de cada juego. Sube solo con 5 aciertos seguidos (u 8 de 10) y baja en silencio tras 3 fallos.</p>
        ${juegos.length ? juegos.map(j => { const d = Juegos.progreso.leer(j); return `<div class="fila" data-juego="${j}">
          <b>${NOMBRES[j] || j}</b><button data-accion="bajar" aria-label="bajar nivel">−</button>
          <span>Nivel ${d.nivel} de ${d.max}</span><button data-accion="subir" aria-label="subir nivel">+</button>
          <button class="peligro" data-accion="reiniciar">Reiniciar</button></div>`; }).join("")
        : `<p>Todavía no hay juegos con niveles guardados.</p>`}
        <div class="acciones"><button class="peligro" data-accion="todo">Reiniciar todo</button><button data-accion="cerrar">Cerrar</button></div>
      </div>`;
    }
    panel.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (e.target === panel) return (panel.hidden = true);
      if (!b) return;
      const j = b.closest(".fila")?.dataset.juego, accion = b.dataset.accion;
      if (accion === "cerrar") return (panel.hidden = true);
      if (accion === "todo") {
        if (!b.dataset.seguro) { b.dataset.seguro = 1; b.textContent = "¿Seguro? Toca otra vez"; return; }
        Juegos.progreso.reiniciar();
      } else if (accion === "reiniciar") Juegos.progreso.reiniciar(j);
      else {
        const d = Juegos.progreso.leer(j);
        Juegos.progreso.guardar(j, { nivel: Math.max(1, Math.min(d.max, d.nivel + (accion === "subir" ? 1 : -1))), racha: 0, fallos: 0, ultimas: [] });
      }
      pintarPanel();
    });

    // Entrada del menú con GSAP: letras que caen rebotando y tarjetas que aparecen en cascada.
    // Sin GSAP (o con movimiento reducido) el menú se muestra quieto, tal cual
    const calma = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (window.gsap && !calma) {
      gsap.from("h1 span", { y: -120, opacity: 0, rotation: () => gsap.utils.random(-30, 30), duration: .9, stagger: .08, ease: "bounce.out" });
      gsap.from(".sub", { opacity: 0, y: 10, duration: .5, delay: .5 });
      gsap.from(".juego", { y: 70, scale: .6, opacity: 0, duration: .7, stagger: .07, delay: .2, ease: "back.out(1.7)", clearProps: "transform,opacity" });
      gsap.from(".icono", { scale: 0, rotation: -40, duration: .6, stagger: .07, delay: .45, ease: "back.out(2.5)", clearProps: "transform" });
      // Cada tanto un dibujo da un saltito para invitar a tocarlo
      setInterval(() => {
        if (document.hidden) return;
        const icono = Juegos.azar([...document.querySelectorAll(".icono")]);
        gsap.timeline()
          .to(icono, { y: -18, scaleY: 1.08, duration: .22, ease: "power2.out" })
          .to(icono, { y: 0, scaleY: 1, duration: .5, ease: "bounce.out" });
      }, 3500);
    }
  </script>
</body>
</html>
